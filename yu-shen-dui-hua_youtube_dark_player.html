  const m = title.match(/與神對話(?:I{1,3}|1|2|3)/);
  if(!m) return '其他';
  const s=m[0];
  if(/III|3/.test(s)) return 'III';
  if(/II|2/.test(s)) return 'II';
  return 'I';
}
function episode(title){
  const m=title.match(/Ep(\d+)/); return m ? 'Ep'+m[1] : '';
}
function filtered(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  return videos.map((v,i)=>({...v,index:i,book:getBook(v.title)}))
    .filter(v=>(bookFilter==='all'||v.book===bookFilter)&&(!q||v.title.toLowerCase().includes(q)||episode(v.title).toLowerCase().includes(q)));
}
function renderList(){
  const arr=filtered(), list=document.getElementById('list');
  list.innerHTML='';
  document.getElementById('count').textContent=`顯示 ${arr.length} / ${videos.length} 集`;
  arr.forEach(v=>{
    const b=document.createElement('button'); b.className='item'+(v.index===current?' active':'');
    b.innerHTML=`<div class="ep">${episode(v.title)} · Book ${v.book}</div><div class="title">${escapeHtml(v.title.replace(/^Ep\d+\./,''))}</div>`;
    b.onclick=()=>play(v.index);
    list.appendChild(b);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(i){
  current=i; const v=videos[i];
  document.getElementById('player').src=`https://www.youtube.com/embed/${v.id}?rel=0`;
  document.getElementById('currentTitle').textContent=v.title;
  document.getElementById('meta').textContent=`${episode(v.title)} · Book ${v.book} · ${i+1}/${videos.length}`;
  document.getElementById('bookTag').textContent=`Book ${v.book}`;
  renderList();
  document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'});
}
function openYoutube(){window.open(`https://www.youtube.com/watch?v=${videos[current].id}`,'_blank','noopener');}
function filterBook(b){bookFilter=b;renderList();}
document.getElementById('search').addEventListener('input',renderList);
document.getElementById('prev').onclick=()=>play((current-1+videos.length)%videos.length);
document.getElementById('next').onclick=()=>play((current+1)%videos.length);

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')play((current-1+videos.length)%videos.length);
  if(e.key==='ArrowRight')play((current+1)%videos.length);
});
play(0);
</script>
</body>
</html>
