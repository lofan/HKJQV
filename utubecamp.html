<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CAMPSPOT - Outdoor YouTube Directory</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#111827',
              950: '#030712',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans pb-12">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 shrink-0">
        <div class="bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20">
          <i data-lucide="compass" class="w-5 h-5 text-emerald-400"></i>
        </div>
        <h1 class="text-lg font-bold tracking-wide">CAMPSPOT</h1>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Search channels, gear, rain ASMR, dogs..."
          class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-8 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
        />
        <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-white">
          &times;
        </button>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center space-x-3 shrink-0">
        <nav class="flex items-center space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
          <button
            id="tab-discover"
            onclick="switchTab('discover')"
            class="tab-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition bg-emerald-600 text-white shadow"
          >
            <i data-lucide="grid" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Discover</span>
          </button>

          <button
            id="tab-favorites"
            onclick="switchTab('favorites')"
            class="tab-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition text-slate-400 hover:text-slate-200"
          >
            <i data-lucide="heart" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Saved</span>
            <span id="favCount" class="bg-emerald-950 text-emerald-300 border border-emerald-800 px-1.5 py-0.2 text-[10px] rounded-full">
              0
            </span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-6">
    
    <!-- Category Pills Bar -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-1" id="categoryPills">
      <i data-lucide="filter" class="w-4 h-4 text-slate-500 shrink-0 mr-1"></i>
    </div>

    <!-- TAB 1: DISCOVER GRID VIEW -->
    <section id="view-discover" class="tab-view grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Cards rendered dynamically -->
    </section>

    <!-- TAB 2: FAVORITES VIEW -->
    <section id="view-favorites" class="tab-view hidden space-y-4">
      <h2 class="text-sm font-semibold text-slate-400 flex items-center gap-2">
        <i data-lucide="heart" class="w-4 h-4 text-rose-500 fill-rose-500"></i>
        <span>Saved Camping Channels</span>
      </h2>
      <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Favorite items rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- Application Logic -->
  <script>
    // Format channel URL to /videos
    function getVideosFeedUrl(baseUrl) {
      const cleanUrl = baseUrl.replace(/\/+$/, '').replace(/\/videos$/, '');
      return `${cleanUrl}/videos`;
    }

    const CHANNELS = [
      {
        id: "Ssoberry",
        name: "쏘베리 Ssoberry",
        handle: "@ssoberrycamping",
        subscribers: "1.32M",
        channelUrl: "https://www.youtube.com/@ssoberrycamping",
        vibe: "Car Camping & Dog-Friendly Mukbang",
        category: "Pet Camping",
        description: "Atmospheric car camping, compact camper van trips, and cozy shelter camping with her pet dog. Features campfire meals, seasonal vlogs, and soothing rain ASMR.",
        tags: ["Pet Camping", "Car Camping", "Mukbang", "Rain ASMR"]
      },
      {
        id: "Haneulcamp",
        name: "놀면뭐하늘 (Haneulcamp)",
        handle: "@Haneulcamp",
        subscribers: "1.20M",
        channelUrl: "https://www.youtube.com/@Haneulcamp",
        vibe: "Pet-Friendly & Mukbang",
        category: "Pet Camping",
        description: "Solo camping adventures with Dubu, an 11-year-old Labrador Retriever. Blends nature, delicious campsite meals, and creek ASMR.",
        tags: ["Dog Camping", "Mukbang", "Solo Female"]
      },
      {
        id: "ForestGirlLiving",
        name: "Forest Girl Living",
        handle: "@ForestGirlLiving",
        subscribers: "850K",
        channelUrl: "https://www.youtube.com/@ForestGirlLiving",
        vibe: "Slow-Living Wilderness",
        category: "Relaxation & ASMR",
        description: "Cinematic solo female camping focused on reconnecting with nature, outdoor cooking, and mindfulness in quiet settings.",
        tags: ["Slow Living", "Nature ASMR", "Mindfulness"]
      },
      {
        id: "KirinCamp",
        name: "Kirin Camp",
        handle: "@KirinCamp",
        subscribers: "2.10M",
        channelUrl: "https://www.youtube.com/@KirinCamp",
        vibe: "Heavy Rain ASMR & Air Tents",
        category: "Relaxation & ASMR",
        description: "Famous for high-end air-tent setups, luxury gear, and high-fidelity audio of heavy rain falling on canvas shelters.",
        tags: ["Heavy Rain", "Air Tent", "Luxury Gear"]
      },
      {
        id: "Uni_Camp",
        name: "UNI CAMP",
        handle: "@Uni_Camp",
        subscribers: "940K",
        channelUrl: "https://www.youtube.com/@Uni_Camp",
        vibe: "Cozy Solo & Pet Kkomi",
        category: "Pet Camping",
        description: "Cozy solo trips accompanied by her pet dog Kkomi. Features high production value, aesthetic setups, and tasty Korean camp meals.",
        tags: ["Dog-Friendly", "Cozy Setup", "Korean Food"]
      },
      {
        id: "dulgiyat",
        name: "둘기얏 (dulgiyat)",
        handle: "@dulgiyat",
        subscribers: "620K",
        channelUrl: "https://www.youtube.com/@dulgiyat",
        vibe: "Minimalist & Clean",
        category: "Solo Camping",
        description: "Known for clean, quiet edits, practical outdoor gear usage, mountain setups, and peaceful camp cooking ASMR.",
        tags: ["Minimalist", "Mountain Camping", "Quiet Vlogs"]
      },
      {
        id: "AYACAMPING",
        name: "AYA CAMPING",
        handle: "@AYACAMPING",
        subscribers: "510K",
        channelUrl: "https://www.youtube.com/@AYACAMPING",
        vibe: "SUV Car Camping (차박)",
        category: "Car Camping",
        description: "Versatile outdoor trips focusing on SUV car camping, winter snow shelters, and satisfying outdoor meal preparations.",
        tags: ["Car Camping", "Snow Camping", "Shelter"]
      },
      {
        id: "RYUCAMP",
        name: "RYU CAMP",
        handle: "@RYUCAMP",
        subscribers: "1.50M",
        channelUrl: "https://www.youtube.com/@RYUCAMP",
        vibe: "Stealth & Heavy Rain",
        category: "Relaxation & ASMR",
        description: "Atmospheric solo camping featuring rich natural soundscapes, heavy rain shelter setups, and winter woodstove heating.",
        tags: ["Stealth Camping", "Woodstove", "Rain Sound"]
      },
      {
        id: "bushcraft",
        name: "bushcraft",
        handle: "@bushcraftb1485",
        subscribers: "780K",
        channelUrl: "https://www.youtube.com/@bushcraftb1485",
        vibe: "Primitive Survival",
        category: "Bushcraft & Survival",
        description: "Pure bushcraft skills—building natural shelters from forest timber, friction fire starting, and primitive survival cooking.",
        tags: ["Bushcraft", "Survival", "Natural Shelter"]
      },
      {
        id: "Wild_Anne",
        name: "Wild Anne",
        handle: "@Wild_Anne",
        subscribers: "430K",
        channelUrl: "https://www.youtube.com/@Wild_Anne",
        vibe: "Rugged Wilderness",
        category: "Bushcraft & Survival",
        description: "Adventurous solo female camping through extreme weather, deep forest explorations, and tarp shelter setups.",
        tags: ["Rugged", "Extreme Weather", "Tarp Shelter"]
      },
      {
        id: "yoyocamp",
        name: "Yoyo Camp",
        handle: "@yoyocamp",
        subscribers: "390K",
        channelUrl: "https://www.youtube.com/@yoyocamp",
        vibe: "Aesthetic Chill",
        category: "Solo Camping",
        description: "Relaxing solo camping vlogs featuring sleek aesthetic gear, mood lighting, and comforting campfire recipes.",
        tags: ["Aesthetic", "Chill", "Modern Gear"]
      }
    ];

    const CATEGORIES = ["All", "Relaxation & ASMR", "Pet Camping", "Solo Camping", "Car Camping", "Bushcraft & Survival"];

    // App State
    let currentTab = "discover";
    let searchQuery = "";
    let selectedCategory = "All";
    let favorites = JSON.parse(localStorage.getItem("campspot_favorites") || '["Ssoberry", "Haneulcamp", "KirinCamp"]');

    // DOM Elements
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const categoryPills = document.getElementById("categoryPills");
    const favCount = document.getElementById("favCount");

    // Initialize Application
    function init() {
      favCount.innerText = favorites.length;
      renderCategoryPills();
      setupEventListeners();
      updateView();
    }

    function setupEventListeners() {
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        clearSearchBtn.classList.toggle("hidden", searchQuery === "");
        updateView();
      });

      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        searchQuery = "";
        clearSearchBtn.classList.add("hidden");
        updateView();
      });
    }

    // Tab Navigation
    function switchTab(tab) {
      currentTab = tab;
      
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.className = "tab-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition text-slate-400 hover:text-slate-200";
      });
      
      const activeBtn = document.getElementById(`tab-${tab}`);
      activeBtn.className = "tab-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition bg-emerald-600 text-white shadow";

      document.querySelectorAll(".tab-view").forEach(view => view.classList.add("hidden"));
      
      if (tab === "discover") {
        document.getElementById("view-discover").classList.remove("hidden");
        document.getElementById("view-discover").classList.add("grid");
      } else if (tab === "favorites") {
        document.getElementById("view-favorites").classList.remove("hidden");
        document.getElementById("view-favorites").classList.add("block");
      }

      updateView();
    }

    // Render Category Filter Pills
    function renderCategoryPills() {
      categoryPills.innerHTML = `<i data-lucide="filter" class="w-4 h-4 text-slate-500 shrink-0 mr-1"></i>`;
      CATEGORIES.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
          selectedCategory === cat
            ? "bg-slate-200 text-slate-900 font-semibold"
            : "bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200"
        }`;
        btn.innerText = cat;
        btn.onclick = () => {
          selectedCategory = cat;
          renderCategoryPills();
          updateView();
        };
        categoryPills.appendChild(btn);
      });
      lucide.createIcons();
    }

    // Toggle Favorites
    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem("campspot_favorites", JSON.stringify(favorites));
      favCount.innerText = favorites.length;
      updateView();
    }

    // Filter Logic
    function getFilteredChannels() {
      return CHANNELS.filter(channel => {
        const matchesSearch =
          channel.name.toLowerCase().includes(searchQuery) ||
          channel.vibe.toLowerCase().includes(searchQuery) ||
          channel.tags.some(tag => tag.toLowerCase().includes(searchQuery));

        const matchesCategory = selectedCategory === "All" || channel.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });
    }

    // Render View
    function updateView() {
      const filtered = getFilteredChannels();

      // Update Discover Grid
      const discoverGrid = document.getElementById("view-discover");
      if (filtered.length === 0) {
        discoverGrid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900/40 rounded-xl border border-slate-800">
            <p class="text-slate-400 text-sm">No channels matched your filter criteria.</p>
          </div>`;
      } else {
        discoverGrid.innerHTML = filtered.map(channel => {
          const isFav = favorites.includes(channel.id);
          const videosUrl = getVideosFeedUrl(channel.channelUrl);
          return `
            <div class="bg-slate-900/70 rounded-xl border border-slate-800 p-5 flex flex-col justify-between hover:border-slate-700 transition group relative">
              <div>
                <div class="flex items-start justify-between gap-2 mb-2">
                  <div>
                    <div class="flex items-center space-x-2 mb-0.5">
                      <span class="text-[10px] uppercase font-mono text-emerald-400 tracking-wider">${channel.category}</span>
                      <span class="text-[10px] bg-slate-800 text-slate-300 font-mono px-1.5 py-0.2 rounded border border-slate-700/60">${channel.subscribers} subs</span>
                    </div>
                    <h3 class="font-semibold text-white group-hover:text-emerald-400 transition">${channel.name}</h3>
                    <p class="text-xs text-slate-400">${channel.handle}</p>
                  </div>
                  
                  <button
                    onclick="toggleFavorite('${channel.id}')"
                    class="p-1.5 rounded-lg border transition ${isFav ? 'bg-rose-950/50 border-rose-800 text-rose-400' : 'bg-slate-950 border-slate-800 text-slate-500 hover:text-slate-300'}"
                  >
                    <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-400' : ''}"></i>
                  </button>
                </div>
                <p class="text-xs text-slate-300 line-clamp-3 leading-relaxed mb-4">${channel.description}</p>
              </div>

              <div>
                <div class="flex flex-wrap gap-1.5 mb-4">
                  ${channel.tags.map(tag => `<span class="text-[10px] px-2 py-0.5 bg-slate-950 border border-slate-800 text-slate-400 rounded">#${tag}</span>`).join('')}
                </div>
                <a
                  href="${videosUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="w-full flex items-center justify-center space-x-1.5 py-2 px-3 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-medium transition"
                >
                  <i data-lucide="youtube" class="w-4 h-4"></i>
                  <span>Watch Latest Uploads</span>
                </a>
              </div>
            </div>
          `;
        }).join('');
      }

      // Update Favorites Tab
      const favoritesGrid = document.getElementById("favoritesGrid");
      const favChannels = CHANNELS.filter(c => favorites.includes(c.id));

      if (favChannels.length === 0) {
        favoritesGrid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900/40 rounded-xl border border-slate-800">
            <p class="text-slate-400 text-sm">No saved channels yet. Click the heart icon on any channel card to save it.</p>
          </div>`;
      } else {
        favoritesGrid.innerHTML = favChannels.map(channel => {
          const videosUrl = getVideosFeedUrl(channel.channelUrl);
          return `
            <div class="bg-slate-900/70 rounded-xl border border-slate-800 p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between gap-2 mb-2">
                  <div>
                    <div class="flex items-center space-x-2 mb-0.5">
                      <span class="text-[10px] uppercase font-mono text-emerald-400">${channel.category}</span>
                      <span class="text-[10px] bg-slate-800 text-slate-300 font-mono px-1.5 py-0.2 rounded border border-slate-700/60">${channel.subscribers} subs</span>
                    </div>
                    <h3 class="font-semibold text-white">${channel.name}</h3>
                    <p class="text-xs text-slate-400">${channel.handle}</p>
                  </div>
                  <button
                    onclick="toggleFavorite('${channel.id}')"
                    class="p-1.5 rounded-lg border bg-rose-950/50 border-rose-800 text-rose-400"
                  >
                    <i data-lucide="heart" class="w-4 h-4 fill-rose-400"></i>
                  </button>
                </div>
                <p class="text-xs text-slate-300 line-clamp-2 mb-4">${channel.description}</p>
              </div>
              <a
                href="${videosUrl}"
                target="_blank"
                rel="noopener noreferrer"
                class="w-full flex items-center justify-center space-x-1.5 py-2 px-3 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-medium transition"
              >
                <i data-lucide="youtube" class="w-4 h-4"></i>
                <span>Watch Latest Uploads</span>
              </a>
            </div>
          `;
        }).join('');
      }

      // Re-initialize Lucide icons
      lucide.createIcons();
    }

    // Run application on page load
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
