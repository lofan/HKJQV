    // Global state
    let currentTab = 'overview';

    // Build sidebar dishes list dynamically
    function initSidebar() {
      const listContainer = document.getElementById('dishes-nav-list');
      listContainer.innerHTML = '';

      videoData.dishes.forEach((dish) => {
        const btn = document.createElement('button');
        btn.id = `nav-${dish.id}`;
        btn.onclick = () => switchTab(dish.id);
        btn.className = `nav-btn w-full text-left p-2.5 rounded-xl flex items-center justify-between transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white`;
        
        // Color scale according to rank danger
        let badgeBg = dish.rank <= 3 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : (dish.rank <= 6 ? 'bg-orange-500/20 text-orange-400' : 'bg-slate-800 text-slate-300');
        
        btn.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="w-6 h-6 rounded-md font-black text-xs flex items-center justify-center ${badgeBg}">
              ${dish.rank}
            </span>
            <span class="font-medium text-sm truncate max-w-[170px]">${dish.name}</span>
          </div>
          <span class="text-[11px] font-bold text-slate-400 bg-slate-950 px-2 py-0.5 rounded">${dish.calories}</span>
        `;
        listContainer.appendChild(btn);
      });
    }

    // Switch view content dynamically
    function switchTab(tabId) {
      currentTab = tabId;

      // Update navbar button states
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-white', 'border-l-4', 'border-red-500', 'font-bold');
        btn.classList.add('text-slate-300');
      });

      const activeBtn = document.getElementById(`nav-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-slate-800', 'text-white', 'border-l-4', 'border-red-500', 'font-bold');
      }

      // Close mobile menu after clicking
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth < 768) {
        sidebar.classList.add('hidden');
        document.getElementById('menu-icon').className = 'fa-solid fa-bars text-xl';
      }

      // Render content
      const displayArea = document.getElementById('content-display');
      
      if (tabId === 'overview') {
        renderOverview(displayArea);
      } else if (tabId === 'tips') {
        renderTips(displayArea);
      } else {
        const dish = videoData.dishes.find(d => d.id === tabId);
        if (dish) renderDishDetail(displayArea, dish);
      }
    }

            </div>
            <div class="flex items-center gap-2 text-red-400 font-bold text-sm mb-2">
              <i class="fa-solid fa-triangle-exclamation"></i> 熱門減肥影片拆解
            </div>
            <h2 class="text-2xl md:text-3xl font-black text-white leading-tight mb-3">
              ${videoData.overview.title}
            </h2>
            <div class="flex flex-wrap gap-4 text-xs text-slate-400 pt-2 border-t border-slate-800/80">
              <span><i class="fa-regular fa-user mr-1 text-slate-300"></i> ${videoData.channel}</span>
              <span><i class="fa-regular fa-calendar mr-1 text-slate-300"></i> ${videoData.publishDate}</span>
            </div>
          </div>

          <!-- Core Summary Card -->
          <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-bullseye text-red-500"></i> 內容核心摘要
            </h3>
            <p class="text-slate-300 leading-relaxed text-sm md:text-base">
              ${videoData.overview.summary}
            </p>
          </div>

          <!-- Quick Dish Grid Overview -->
          <div class="space-y-3">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-list-ol text-orange-500"></i> 排行榜速覽
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${videoData.dishes.map(d => `
                <div onclick="switchTab('${d.id}')" class="cursor-pointer bg-slate-900/80 hover:bg-slate-800 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between transition-all group">
                  <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-lg font-black text-xs flex items-center justify-center ${d.rank <= 3 ? 'bg-red-500 text-white' : 'bg-slate-800 text-slate-400'}">
                      #${d.rank}
                    </span>
                    <div>
                      <div class="font-bold text-sm text-slate-200 group-hover:text-red-400 transition-colors">${d.name}</div>
                      <div class="text-xs text-slate-500">${d.badge}</div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-xs font-bold text-slate-300">${d.calories}</div>
                    <i class="fa-solid fa-chevron-right text-[10px] text-slate-600 group-hover:text-slate-400"></i>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Render Dish Detail Section
    function renderDishDetail(container, dish) {
      // Danger Stars SVG Generator
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        if (i <= dish.dangerLevel) {
          stars += `<i class="fa-solid fa-star text-red-500"></i>`;
        } else {
          stars += `<i class="fa-regular fa-star text-slate-600"></i>`;
        }
      }

      container.innerHTML = `
        <div class="space-y-6 animate-fadeIn">
          <!-- Dish Title Banner -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 relative overflow-hidden">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-black ${dish.rank <= 3 ? 'bg-red-500 text-white' : 'bg-orange-500/20 text-orange-400 border border-orange-500/30'}">
                爆脂排行榜 第 ${dish.rank} 位
              </span>
              <div class="flex items-center gap-1 text-sm">
                <span class="text-xs text-slate-400 mr-1">爆脂指數：</span>
                ${stars}
              </div>
            </div>
            
            <h2 class="text-2xl md:text-3xl font-black text-white mb-2">
              ${dish.name}
            </h2>
            <span class="inline-block bg-slate-800 text-slate-300 text-xs px-3 py-1 rounded-lg border border-slate-700">
              🏷️ ${dish.badge}
            </span>
          </div>

          <!-- Stats Grid -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div class="text-xs text-slate-400 mb-1">估計熱量</div>
              <div class="text-lg md:text-xl font-black text-red-400">${dish.calories}</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div class="text-xs text-slate-400 mb-1">脂肪含量</div>
              <div class="text-lg md:text-xl font-black text-orange-400">${dish.fat}</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div class="text-xs text-slate-400 mb-1">碳水化合物</div>
              <div class="text-lg md:text-xl font-black text-amber-400">${dish.carbs}</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
              <div class="text-xs text-slate-400 mb-1">消耗所需運動</div>
              <div class="text-xs md:text-sm font-bold text-emerald-400 mt-1">${dish.exerciseNeeded}</div>
            </div>
          </div>

          <!-- Fat Traps Breakdown -->
          <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
              <i class="fa-solid fa-skull-crossbones text-red-500"></i> 肥胖陷阱深度拆解
            </h3>
            <ul class="space-y-3">
              ${dish.traps.map(trap => `
                <li class="flex items-start gap-3 text-sm md:text-base text-slate-300">
                  <div class="w-5 h-5 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center flex-shrink-0 mt-0.5">
                    <i class="fa-solid fa-xmark text-xs"></i>
                  </div>
                  <div class="leading-relaxed">${trap}</div>
                </li>
              `).join('')}
            </ul>
          </div>

          <!-- Bottom Navigation buttons -->
          <div class="flex justify-between items-center pt-4">
            ${dish.rank < 10 ? `
              <button onclick="switchTab('dish-${dish.rank + 1}')" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs md:text-sm font-bold rounded-xl border border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> 上一位 (#${dish.rank + 1})
              </button>
            ` : '<div></div>'}

            ${dish.rank > 1 ? `
              <button onclick="switchTab('dish-${dish.rank - 1}')" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs md:text-sm font-bold rounded-xl flex items-center gap-2">
                下一位 (#${dish.rank - 1}) <i class="fa-solid fa-arrow-right"></i>
              </button>
            ` : '<div></div>'}
          </div>
        </div>
      `;
    }

    // Render Healthy Tips Section
    function renderTips(container) {
      container.innerHTML = `
        <div class="space-y-6 animate-fadeIn">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-2xl font-black text-white flex items-center gap-3">
              <i class="fa-solid fa-heart-pulse text-emerald-400"></i> 茶餐廳減肥自救三大貼士
            </h2>
            <p class="text-xs md:text-sm text-slate-400 mt-1">健身教練 Fred 建議：無須完全遠離茶餐廳，只需掌握以下技巧即可大大降低熱量負擔！</p>
          </div>

          <div class="grid grid-cols-1 gap-4">
            ${videoData.tips.map((tip, idx) => `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-start gap-4">
                <div class="w-12 h-12 rounded-xl ${tip.color} flex items-center justify-center flex-shrink-0 text-xl">
                  <i class="fa-solid ${tip.icon}"></i>
                </div>
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-500">RULE 0${idx + 1}</span>
                    <h3 class="font-bold text-lg text-white">${tip.title}</h3>
                  </div>
                  <p class="text-sm text-slate-300 leading-relaxed">${tip.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="bg-gradient-to-br from-emerald-950/30 to-slate-900 border border-emerald-500/20 rounded-2xl p-6 text-center space-y-3">
            <i class="fa-solid fa-award text-3xl text-emerald-400"></i>
            <h3 class="text-lg font-bold text-white">總結迷思拆解</h3>
            <p class="text-sm text-slate-300 max-w-xl mx-auto leading-relaxed">
              不要盲目相信「蒸飯」或「有蔬菜配搭」就等於低卡路里。只要經過廚房打厚芡、大火過油炸、使用肥肉部位或高糖精華汁撈飯，實際熱量隨時比直接食炸雞髀更驚人！
            </p>
          </div>
        </div>
      `;
    }

    // Mobile Navigation Toggle
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      const menuIcon = document.getElementById('menu-icon');
      
      if (sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('hidden');
        menuIcon.className = 'fa-solid fa-xmark text-xl';
      } else {
        sidebar.classList.add('hidden');
        menuIcon.className = 'fa-solid fa-bars text-xl';
      }
    });

    // Initialize application on window load
    window.onload = function() {
      initSidebar();
      switchTab('overview');
    };
  </script>
</body>
</html>
