                tags: ['美股深度', '產業結構', '宏觀趨勢', '進階研究'],
                searchQuery: '美投講美股 YouTube'
            },
            {
                id: 'president-securities',
                name: '統一投顧',
                category: 'advanced',
                categoryName: '進階',
                desc: '提供機構法人級的投顧研究報告精華，適合想學會用法人思維剖析市場的投資人。',
                tags: ['機構法人', '研報精華', '法人思維', '權威研究'],
                searchQuery: '統一投顧 YouTube'
            },
            {
                id: 'analyst-li',
                name: '辣個分析師－黎志建',
                category: 'advanced',
                categoryName: '進階',
                desc: '科技產業實務背景出身，擅長極度深度的產業研究、供應鏈拆解與個股評價。',
                tags: ['產業供應鏈', '個股評價', '深度研究', '產業專家'],
                searchQuery: '辣個分析師 黎志建 YouTube'
            }
        ];

        let activeCategory = 'all';
        let searchQuery = '';
        let activeTag = null;
        let showFavoritesOnly = false;
        let favorites = JSON.parse(localStorage.getItem('fin_yt_favs') || '[]');

        // DOM elements
        const channelGrid = document.getElementById('channel-grid');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const categoryTabs = document.getElementById('category-tabs');
        const tagPillsContainer = document.getElementById('tag-pills');
        const favCountBadge = document.getElementById('fav-count');
        const favoritesToggleBtn = document.getElementById('favorites-toggle-btn');
        const totalCountEl = document.getElementById('total-count');

        // Utility to extract all tags and render popular tag choices
        function renderPopularTags() {
            const tagCounts = {};
            channelsData.forEach(c => {
                c.tags.forEach(t => {
                    tagCounts[t] = (tagCounts[t] || 0) + 1;
                });
            });

            // Sort tags by frequency
            const sortedTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]).slice(0, 10);

            let html = '<span class="text-slate-400 flex items-center gap-1"><i data-lucide="tag" class="w-3.5 h-3.5"></i> 熱門標籤:</span>';
            sortedTags.forEach(tag => {
                const isActive = activeTag === tag;
                html += `
                    <button data-tag="${tag}" class="tag-pill px-2.5 py-1 rounded-md text-xs border transition ${
                        isActive 
                        ? 'bg-amber-500/20 text-amber-300 border-amber-500/50' 
                        : 'bg-slate-800/80 text-slate-400 border-slate-700 hover:text-slate-200'
                    }">
                        #${tag}
                    </button>
                `;
            });

            if (activeTag) {
                html += `
                    <button id="clear-tag" class="text-xs text-rose-400 hover:underline flex items-center gap-1 ml-1">
                        清除標籤 <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                `;
            }

            tagPillsContainer.innerHTML = html;
            lucide.createIcons();
        }

        // Render channel cards
        function renderChannels() {
            const filtered = channelsData.filter(item => {
                // Category filter
                if (activeCategory !== 'all' && item.category !== activeCategory) return false;

                // Favorites filter
                if (showFavoritesOnly && !favorites.includes(item.id)) return false;

                // Tag filter
                if (activeTag && !item.tags.includes(activeTag)) return false;

                // Search query filter
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    const matchName = item.name.toLowerCase().includes(q);
                    const matchDesc = item.desc.toLowerCase().includes(q);
                    const matchTags = item.tags.some(t => t.toLowerCase().includes(q));
                    const matchCat = item.categoryName.includes(q);
                    return matchName || matchDesc || matchTags || matchCat;
                }

                return true;
            });

            totalCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                channelGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            channelGrid.innerHTML = filtered.map(item => {
                const isFav = favorites.includes(item.id);
                
                // Styling theme map
                let badgeStyle = '';
                let borderHoverStyle = '';
                let dotColor = '';

                if (item.category === 'beginner') {
                    badgeStyle = 'bg-emerald-950/80 text-emerald-400 border-emerald-800/50';
                    borderHoverStyle = 'hover:border-emerald-500/50';
                    dotColor = 'bg-emerald-500';
                } else if (item.category === 'intermediate') {
                    badgeStyle = 'bg-amber-950/80 text-amber-400 border-amber-800/50';
                    borderHoverStyle = 'hover:border-amber-500/50';
                    dotColor = 'bg-amber-500';
                } else {
                    badgeStyle = 'bg-red-950/80 text-red-400 border-red-800/50';
                    borderHoverStyle = 'hover:border-red-500/50';
                    dotColor = 'bg-red-500';
                }

                const tagsHtml = item.tags.map(t => `
                    <span class="px-2 py-0.5 rounded text-[11px] bg-slate-800 text-slate-300 border border-slate-700/60">
                        #${t}
                    </span>
                `).join('');

                const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.searchQuery)}`;

                return `
                    <div class="glass-panel rounded-2xl p-5 flex flex-col justify-between card-hover border border-slate-800 ${borderHoverStyle} relative group">
                        <div>
                            <!-- Card Header -->
                            <div class="flex items-start justify-between gap-2 mb-3">
                                <div class="flex items-center gap-2">
                                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeStyle}">
                                        <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span>
                                        ${item.categoryName}
                                    </span>
                                </div>
                                <button data-fav-id="${item.id}" class="fav-btn p-2 rounded-lg text-slate-500 hover:text-rose-500 hover:bg-slate-800/60 transition" title="${isFav ? '取消收藏' : '加入收藏'}">
                                    <i data-lucide="heart" class="w-5 h-5 ${isFav ? 'fill-rose-500 text-rose-500' : ''}"></i>
                                </button>
                            </div>

                            <!-- Channel Name -->
                            <h3 class="text-lg font-bold text-slate-100 group-hover:text-amber-400 transition flex items-center gap-2">
                                ${item.name}
                            </h3>

                            <!-- Description -->
                            <p class="text-xs sm:text-sm text-slate-400 my-3 leading-relaxed">
                                ${item.desc}
                            </p>
                        </div>

                        <div>
                            <!-- Tags -->
                            <div class="flex flex-wrap gap-1.5 my-3">
                                ${tagsHtml}
                            </div>

                            <!-- YouTube Link Action -->
                            <a href="${ytUrl}" target="_blank" rel="noopener noreferrer" 
                                class="mt-2 w-full py-2.5 px-4 rounded-xl bg-slate-800/90 hover:bg-red-600 text-slate-200 hover:text-white font-medium text-xs sm:text-sm flex items-center justify-center gap-2 transition duration-200 border border-slate-700 hover:border-red-500 shadow-sm">
                                <i data-lucide="youtube" class="w-4 h-4 text-red-500 group-hover:text-white transition"></i>
                                <span>開啟 YouTube 頻道</span>
                                <i data-lucide="external-link" class="w-3.5 h-3.5 opacity-60"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
            attachCardEvents();
        }

        function attachCardEvents() {
            // Favorite buttons
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-fav-id');
                    if (favorites.includes(id)) {
                        favorites = favorites.filter(f => f !== id);
                    } else {
                        favorites.push(id);
                    }
                    localStorage.setItem('fin_yt_favs', JSON.stringify(favorites));
                    updateFavBadge();
                    renderChannels();
                });
            });
        }

        function updateFavBadge() {
            favCountBadge.textContent = favorites.length;
        }

        // Search input handling
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearSearchBtn.classList.toggle('hidden', !searchQuery);
            renderChannels();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderChannels();
        });

        // Category Tab switching
        categoryTabs.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;

            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'bg-slate-800', 'text-white', 'border-slate-700');
                b.classList.add('text-slate-400', 'border-transparent');
            });

            btn.classList.add('active', 'bg-slate-800', 'text-white', 'border-slate-700');
            btn.classList.remove('text-slate-400', 'border-transparent');

            activeCategory = btn.getAttribute('data-cat');
            renderChannels();
        });

        // Tag Pills click handling
        tagPillsContainer.addEventListener('click', (e) => {
            const tagBtn = e.target.closest('.tag-pill');
            const clearBtn = e.target.closest('#clear-tag');

            if (tagBtn) {
                const tag = tagBtn.getAttribute('data-tag');
                activeTag = activeTag === tag ? null : tag;
                renderPopularTags();
                renderChannels();
            } else if (clearBtn) {
                activeTag = null;
                renderPopularTags();
                renderChannels();
            }
        });

        // Toggle Favorites mode
        favoritesToggleBtn.addEventListener('click', () => {
            showFavoritesOnly = !showFavoritesOnly;
            if (showFavoritesOnly) {
                favoritesToggleBtn.classList.remove('bg-rose-950/40', 'border-rose-800/40', 'text-rose-400');
                favoritesToggleBtn.classList.add('bg-rose-600', 'text-white', 'border-rose-500');
            } else {
                favoritesToggleBtn.classList.add('bg-rose-950/40', 'border-rose-800/40', 'text-rose-400');
                favoritesToggleBtn.classList.remove('bg-rose-600', 'text-white', 'border-rose-500');
            }
            renderChannels();
        });

        // Reset filters
        document.getElementById('reset-filters').addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            activeCategory = 'all';
            activeTag = null;
            showFavoritesOnly = false;
            clearSearchBtn.classList.add('hidden');

            favoritesToggleBtn.classList.add('bg-rose-950/40', 'border-rose-800/40', 'text-rose-400');
            favoritesToggleBtn.classList.remove('bg-rose-600', 'text-white', 'border-rose-500');

            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'bg-slate-800', 'text-white', 'border-slate-700');
                b.classList.add('text-slate-400', 'border-transparent');
                if (b.getAttribute('data-cat') === 'all') {
                    b.classList.add('active', 'bg-slate-800', 'text-white', 'border-slate-700');
                }
            });

            renderPopularTags();
            renderChannels();
        });

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            if (!isDark) {
                document.body.classList.remove('bg-slate-950', 'text-slate-100');
                document.body.classList.add('bg-slate-100', 'text-slate-900');
            } else {
                document.body.classList.remove('bg-slate-100', 'text-slate-900');
                document.body.classList.add('bg-slate-950', 'text-slate-100');
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateFavBadge();
            renderPopularTags();
            renderChannels();
            lucide.createIcons();
        });
    </script>
</body>
</html>
