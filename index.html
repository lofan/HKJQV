<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wikipedia & Multi-Engine Search Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --header-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1c1e21;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --label-color: #65676b;
            --accent-color: #0064d1;
            --header-height: auto;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --header-bg: rgba(36, 37, 38, 0.95);
            --text-color: #e4e6eb;
            --card-bg: #242526;
            --border-color: #3e4042;
            --label-color: #b0b3b8;
            --accent-color: #4599ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s ease;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 20px 15px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .search-bar {
            border-radius: 28px;
            padding: 12px 45px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px; 
            width: 100%;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }

        .search-bar:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 100, 209, 0.15);
            outline: none;
            background-color: var(--card-bg);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            color: var(--label-color);
            pointer-events: none;
        }

        .clear-icon {
            position: absolute;
            right: 15px;
            color: var(--label-color);
            cursor: pointer;
            padding: 5px;
            display: none;
            font-size: 1.2rem;
        }

        .search-label {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            color: var(--label-color);
            font-size: 0.85rem;
            align-items: center;
        }

        .search-label a {
            text-decoration: none;
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 12px;
            background: rgba(0, 100, 209, 0.05);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .lang-active {
            background: var(--accent-color) !important;
            color: white !important;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary-custom { background-color: var(--accent-color); color: white; border: none; }
        .btn-secondary-custom { background-color: #65676b; color: white; border: none; }

        .main {
            padding-top: 20px;
            padding-bottom: 40px;
        }

        .wiki-articles {
            max-width: 800px;
            margin: 0 auto;
        }

        .external-link-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .external-link-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .external-box {
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 0.75rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .external-box:active { transform: scale(0.95); }

        .external-box i {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .box-britannica i { color: #856404; }
        .box-google i { color: #4285F4; }
        .box-youtube i { color: #ff0000; }
        .box-x i { color: var(--text-color); }
        .box-searxng i { color: #5f74bd; }
        .box-ddg i { color: #de5833; }

        .article-card {
            background: var(--card-bg);
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            text-decoration: none;
            display: block;
            color: inherit;
            border: 1px solid transparent;
        }

        .article-card:hover {
            border-color: var(--accent-color);
            color: inherit;
        }

        .article-card h3 {
            margin: 0 0 8px 0;
            color: var(--accent-color);
            font-size: 1.15rem;
            font-weight: 700;
        }

        .article-card p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.9;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 600px) {
            header { padding: 15px 10px; }
            .search-bar { padding: 10px 40px; }
            .search-label { font-size: 0.8rem; }
            .action-buttons { flex-direction: row; }
            .btn-action { flex: 1; justify-content: center; padding: 10px; }
        }
    </style>
</head>
<body>

<header>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark Mode">
        <i class="fa fa-moon-o"></i>
    </button>

    <div class="search-container">
        <form id="search-form">
            <div class="search-wrapper">
                <i class="fa fa-search search-icon"></i>
                <input type="text" id="search-bar" class="search-bar" placeholder="搜尋維基百科..." autocomplete="off" inputmode="search" required>
                <i class="fa fa-times-circle clear-icon" id="clear-search"></i>
            </div>
            
            <div class="search-label" id="lang-selector">
                <a href="#" onclick="changeLang('zh', this)" class="lang-active">ZH</a> 
                <a href="#" onclick="changeLang('en', this)">EN</a> 
                <a href="#" onclick="changeLang('ja', this)">JP</a> 
                <a href="#" onclick="changeLang('ko', this)">KR</a> 
                <a href="#" onclick="changeLang('fr', this)">FR</a> 
                <a href="#" onclick="changeLang('de', this)">DE</a> 
                <a href="#" onclick="changeLang('es', this)">ES</a> 
                <a href="#" onclick="changeLang('it', this)">IT</a> 
                <span style="opacity: 0.3; margin: 0 5px">|</span>
                <a href="#" onclick="externalSearch('searxng')">SearXNG</a>
                <a href="#" onclick="externalSearch('ddg')">DDG</a>
                <a href="#" onclick="externalSearch('britannica')">Britannica</a>
                <a href="#" onclick="externalSearch('youtube')">YouTube</a>
                <a href="#" onclick="externalSearch('x')">X</a>
                <a href="https://trends.google.com/trends/trendingsearches/daily?geo=HK" target="_blank"><i class="fa fa-line-chart"></i> Trends</a>
            </div>
        </form>

        <div class="action-buttons">
            <button class="btn btn-action btn-primary-custom" id="random-topic">
                <i class="fa fa-lightbulb-o"></i> <span>靈感</span>
            </button>
            <button class="btn btn-action btn-secondary-custom" id="surprise">
                <i class="fa fa-random"></i> <span>隨機</span>
            </button>
        </div>
    </div>
</header>

<main class="main container-fluid">
    <div id="loading" class="loading-spinner">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    
    <div id="wiki-articles" class="wiki-articles"></div>
</main>

<script>
    let currentLang = 'zh';

    const topics = {
        'zh': ['量子力學', '黑洞', '工業革命', '印象派', '文藝復興', '人工智慧', '希臘神話', '恐龍', '古埃及', '巴拿馬運河', '珠穆朗瑪峰', '比特幣', '火星探測', '大堡礁', '虛擬實境'],
        'en': ['Quantum Mechanics', 'Black Hole', 'Industrial Revolution', 'Impressionism', 'Renaissance', 'Artificial Intelligence', 'Greek Mythology', 'Dinosaurs', 'Ancient Egypt', 'Panama Canal', 'Mount Everest', 'Bitcoin', 'Mars Exploration', 'Great Barrier Reef', 'Virtual Reality'],
        'ja': ['量子力学', 'ブラックホール', '産業革命', '印象派', 'ルネサンス', '人工知能', 'ギリシャ神話', '恐竜', '古代エジプト', 'パナマ運河', 'エベレスト', 'ビットコイン', '火星探査', 'グレート・バリア・リーフ', 'バーチャルリアリティ'],
        'ko': ['양자역학', '블랙홀', '산업 혁명', '인상주의', '르네상스', '인공지능', '그리스 신화', '공룡', '고대 이집트', '파나마 운하', '에베레스트 산', '비트코인', '화성 탐사', '대산호초', '가상 현실'],
        'fr': ['Mécanique quantique', 'Trou noir', 'Révolution industrielle', 'Impressionnisme', 'Renaissance', 'Intelligence artificielle', 'Mythologie grecque', 'Dinosaures', 'Égypte antique', 'Canal de Panama', 'Mont Everest', 'Bitcoin', 'Exploration de Mars', 'Grande Barrière de corail', 'Réalité virtuelle'],
        'de': ['Quantenmechanik', 'Schwarzes Loch', 'Industrielle Revolution', 'Impressionismus', 'Renaissance', 'Künstliche Intelligenz', 'Griechische Mythologie', 'Dinosaurier', 'Altes Ägypten', 'Panamakanal', 'Mount Everest', 'Bitcoin', 'Marsexploration', 'Great Barrier Reef', 'Virtuelle Realität'],
        'es': ['Mecánica cuántica', 'Agujero negro', 'Revolución Industrial', 'Impresionismo', 'Renacimiento', 'Inteligencia artificial', 'Mitología griega', 'Dinosaurios', 'Antiguo Egipto', 'Canal de Panamá', 'Monte Everest', 'Bitcoin', 'Exploración de Marte', 'Gran Barrera de Coral', 'Realidad virtual'],
        'it': ['Meccanica quantica', 'Buco nero', 'Rivoluzione industriale', 'Impressionismo', 'Rinascimento', 'Intelligenza artificiale', 'Mitologia greca', 'Dinosauri', 'Antico Egitto', 'Canale di Panama', 'Monte Everest', 'Bitcoin', 'Esplorazione di Marte', 'Grande barriera corallina', 'Realtà virtuale']
    };

    const themeToggle = document.getElementById('theme-toggle');
    const searchBar = document.getElementById('search-bar');
    const clearIcon = document.getElementById('clear-search');
    const body = document.body;

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        setTheme('dark');
    }

    themeToggle.addEventListener('click', () => {
        const isDark = body.getAttribute('data-theme') === 'dark';
        setTheme(isDark ? 'light' : 'dark');
    });

    function setTheme(theme) {
        body.setAttribute('data-theme', theme);
        const icon = themeToggle.querySelector('i');
        if (theme === 'dark') {
            icon.classList.replace('fa-moon-o', 'fa-sun-o');
        } else {
            icon.classList.replace('fa-sun-o', 'fa-moon-o');
        }
    }

    function changeLang(lang, element) {
        currentLang = lang;
        document.querySelectorAll('#lang-selector a').forEach(link => link.classList.remove('lang-active'));
        if (element) element.classList.add('lang-active');
        if(searchBar.value.trim()) performSearch(searchBar.value);
    }

    function externalSearch(engine) {
        const term = searchBar.value.trim();
        if (!term) return;
        let url = '';
        if (engine === 'searxng') url = `https://searxng.site/search?q=${encodeURIComponent(term)}`;
        else if (engine === 'ddg') url = `https://duckduckgo.com/?q=${encodeURIComponent(term)}`;
        else if (engine === 'britannica') url = `https://www.britannica.com/search?query=${encodeURIComponent(term)}`;
        else if (engine === 'youtube') url = `https://www.youtube.com/results?search_query=${encodeURIComponent(term)}`;
        else if (engine === 'x') url = `https://x.com/search?q=${encodeURIComponent(term)}`;
        window.open(url, '_blank');
    }

    async function performSearch(searchTerm) {
        if (!searchTerm.trim()) return;
        
        const resultsContainer = document.getElementById('wiki-articles');
        const loading = document.getElementById('loading');
        
        loading.style.display = 'block';
        resultsContainer.innerHTML = '';

        const url = `https://${currentLang}.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&generator=search&exsentences=2&exintro=1&explaintext=1&gsrsearch=${encodeURIComponent(searchTerm)}&origin=*`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            loading.style.display = 'none';

            const externalContainer = document.createElement('div');
            externalContainer.className = 'external-link-container';

            const engines = [
                { name: 'Google', icon: 'fa-google', box: 'box-google', url: `https://www.google.com/search?q=${encodeURIComponent(searchTerm)}` },
                { name: 'YouTube', icon: 'fa-youtube-play', box: 'box-youtube', url: `https://www.youtube.com/results?search_query=${encodeURIComponent(searchTerm)}` },
                { name: 'SearXNG', icon: 'fa-user-secret', box: 'box-searxng', url: `https://searxng.site/search?q=${encodeURIComponent(searchTerm)}` },
                { name: 'DuckDuckGo', icon: 'fa-search', box: 'box-ddg', url: `https://duckduckgo.com/?q=${encodeURIComponent(searchTerm)}` },
                { name: 'X / Twitter', icon: 'fa-twitter', box: 'box-x', url: `https://x.com/search?q=${encodeURIComponent(searchTerm)}` },
                { name: 'Britannica', icon: 'fa-book', box: 'box-britannica', url: `https://www.britannica.com/search?query=${encodeURIComponent(searchTerm)}` }
            ];

            engines.forEach(engine => {
                const link = document.createElement('a');
                link.className = `external-box ${engine.box}`;
                link.href = engine.url;
                link.target = '_blank';
                link.innerHTML = `<i class="fa ${engine.icon}"></i><span>${engine.name}</span>`;
                externalContainer.appendChild(link);
            });

            resultsContainer.appendChild(externalContainer);

            if (data.query && data.query.pages) {
                const pages = Object.values(data.query.pages).sort((a, b) => (a.index || 0) - (b.index || 0));
                pages.forEach(page => {
                    const card = document.createElement('a');
                    card.className = 'article-card';
                    card.href = `https://${currentLang}.wikipedia.org/?curid=${page.pageid}`;
                    card.target = '_blank';
                    card.innerHTML = `<h3>${page.title}</h3><p>${page.extract || '點擊查看全文...'}</p>`;
                    resultsContainer.appendChild(card);
                });
            } else {
                resultsContainer.innerHTML += `<div class="no-results mt-4">找不到關於 "${searchTerm}" 的維基文章。</div>`;
            }
        } catch (error) {
            loading.style.display = 'none';
            resultsContainer.innerHTML = '<div class="no-results text-danger">連線失敗，請檢查網路。</div>';
        }
    }

    searchBar.addEventListener('input', (e) => {
        clearIcon.style.display = e.target.value.length > 0 ? 'block' : 'none';
    });

    clearIcon.addEventListener('click', () => {
        searchBar.value = '';
        clearIcon.style.display = 'none';
        searchBar.focus();
    });

    document.getElementById('random-topic').addEventListener('click', () => {
        const langTopics = topics[currentLang] || topics['en'];
        const randomItem = langTopics[Math.floor(Math.random() * langTopics.length)];
        searchBar.value = randomItem;
        clearIcon.style.display = 'block';
        performSearch(randomItem);
    });

    document.getElementById('surprise').addEventListener('click', () => {
        window.open(`https://${currentLang}.wikipedia.org/wiki/Special:Random`, '_blank');
    });

    document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        searchBar.blur(); 
        performSearch(searchBar.value);
    });

    window.onload = () => {
        if (window.innerWidth > 768) searchBar.focus();
    };
</script>
</body>
</html>
