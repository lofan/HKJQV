<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced TradingView Link Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tvblue: {
                            DEFAULT: '#2962ff',
                            hover: '#1e4bd8',
                            dark: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-[#131722] text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors duration-300">

    <div class="bg-white dark:bg-[#1e222d] p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200 dark:border-[#2a2e39] w-full max-w-2xl relative transition-all duration-300">
        
        <!-- Top Bar: Title & Theme Toggle -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100 dark:border-[#2a2e39]">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-tvblue flex items-center justify-center text-white shadow-lg shadow-tvblue/30">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">TradingView Link Generator</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Generate professional links and embeds instantly</p>
                </div>
            </div>
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-[#2a2e39] text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-[#363a45] transition-all focus:outline-none" aria-label="Toggle theme">
                <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
            </button>
        </div>

        <!-- Input Section -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <label for="stockCode" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">
                    Stock Code / Symbols <span class="font-normal text-slate-400 dark:text-slate-500">(comma separated)</span>
                </label>
                <span class="text-xs text-tvblue font-medium bg-tvblue/10 px-2 py-0.5 rounded-full">Batch Supported</span>
            </div>
            
            <div class="relative">
                <input type="text" id="stockCode" value="JPM, GS, AAPL" 
                    placeholder="e.g. AAPL, TSLA, JPM, NVDA" 
                    oninput="generateLinks()"
                    class="w-full pl-4 pr-10 py-3 bg-slate-50 dark:bg-[#131722] border border-slate-300 dark:border-[#363a45] rounded-xl text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-tvblue focus:border-transparent transition-all text-sm font-mono">
                
                <!-- Clear Button -->
                <button onclick="clearInput()" title="Clear input" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 transition-colors">
                    <i class="fa-solid fa-circle-xmark text-base"></i>
                </button>
            </div>
            <p class="mt-1.5 text-xs text-slate-400 dark:text-slate-500 flex items-center gap-1">
                <i class="fa-solid fa-circle-info text-[10px]"></i> Tip: Enter multiple symbols like <code class="bg-slate-200 dark:bg-[#2a2e39] px-1 rounded">NVDA, TSLA, MSFT</code>
            </p>
        </div>

        <div class="space-y-4">
            <!-- URL Format Group -->
            <div class="output-group bg-slate-50 dark:bg-[#131722] p-4 rounded-xl border border-slate-200 dark:border-[#2a2e39]">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">URL Format</label>
                    <button onclick="copyText('outUrl', this)" class="text-xs font-medium text-tvblue hover:underline flex items-center gap-1 cursor-pointer">
                        <i class="fa-regular fa-copy"></i> Copy URL
                    </button>
                </div>
                <textarea id="outUrl" readonly class="w-full h-20 p-2.5 font-mono text-xs bg-white dark:bg-[#1e222d] border border-slate-200 dark:border-[#2a2e39] rounded-lg text-slate-800 dark:text-slate-200 resize-y focus:outline-none"></textarea>
            </div>

            <!-- Markdown Format Group -->
            <div class="output-group bg-slate-50 dark:bg-[#131722] p-4 rounded-xl border border-slate-200 dark:border-[#2a2e39]">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Markdown Format</label>
                    <button onclick="copyText('outMarkdown', this)" class="text-xs font-medium text-tvblue hover:underline flex items-center gap-1 cursor-pointer">
                        <i class="fa-regular fa-copy"></i> Copy Markdown
                    </button>
                </div>
                <textarea id="outMarkdown" readonly class="w-full h-20 p-2.5 font-mono text-xs bg-white dark:bg-[#1e222d] border border-slate-200 dark:border-[#2a2e39] rounded-lg text-slate-800 dark:text-slate-200 resize-y focus:outline-none"></textarea>
            </div>

            <!-- HTML Format Group -->
            <div class="output-group bg-slate-50 dark:bg-[#131722] p-4 rounded-xl border border-slate-200 dark:border-[#2a2e39]">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">HTML Format</label>
                    <button onclick="copyText('outHtml', this)" class="text-xs font-medium text-tvblue hover:underline flex items-center gap-1 cursor-pointer">
                        <i class="fa-regular fa-copy"></i> Copy HTML
                    </button>
                </div>
                <textarea id="outHtml" readonly class="w-full h-20 p-2.5 font-mono text-xs bg-white dark:bg-[#1e222d] border border-slate-200 dark:border-[#2a2e39] rounded-lg text-slate-800 dark:text-slate-200 resize-y focus:outline-none"></textarea>
            </div>

            <!-- Simple Text Format Group -->
            <div class="output-group bg-slate-50 dark:bg-[#131722] p-4 rounded-xl border border-slate-200 dark:border-[#2a2e39]">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Simple Text Format</label>
                    <button onclick="copyText('outText', this)" class="text-xs font-medium text-tvblue hover:underline flex items-center gap-1 cursor-pointer">
                        <i class="fa-regular fa-copy"></i> Copy Text
                    </button>
                </div>
                <textarea id="outText" readonly class="w-full h-20 p-2.5 font-mono text-xs bg-white dark:bg-[#1e222d] border border-slate-200 dark:border-[#2a2e39] rounded-lg text-slate-800 dark:text-slate-200 resize-y focus:outline-none"></textarea>
            </div>
        </div>

    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 dark:bg-slate-800 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 z-50">
        <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastMessage" class="text-sm font-medium">Copied to clipboard successfully!</span>
    </div>

    <script>
        // Toggle Theme Functionality
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-sun text-base';
                localStorage.setItem('tv_theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-moon text-base';
                localStorage.setItem('tv_theme', 'dark');
            }
        }

        // Initialize saved theme preference
        (function() {
            const savedTheme = localStorage.getItem('tv_theme');
            const themeIcon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-base';
            }
        })();

        // Clear Input Field
        function clearInput() {
            const input = document.getElementById('stockCode');
            input.value = '';
            generateLinks();
            input.focus();
        }

        // Generate Links (Batch & Single support)
        function generateLinks() {
            const rawInput = document.getElementById('stockCode').value;
            const symbols = rawInput.split(',')
                .map(s => s.trim().toUpperCase())
                .filter(s => s.length > 0);

            if (symbols.length === 0) {
                document.getElementById('outUrl').value = '';
                document.getElementById('outMarkdown').value = '';
                document.getElementById('outHtml').value = '';
                document.getElementById('outText').value = '';
                return;
            }

            let urls = [];
            let markdownLinks = [];
            let htmlLinks = [];
            let simpleTexts = [];

            symbols.forEach(symbol => {
                let url = `https://tradingview.com/chart/?symbol=${encodeURIComponent(symbol)}`;
                urls.push(url);
                markdownLinks.push(`[${symbol}](${url})`);
                htmlLinks.push(`<a href="${url}" target="_blank">${symbol}</a>`);
                simpleTexts.push(`${symbol}: ${url}`);
            });

            document.getElementById('outUrl').value = urls.join('\n');
            document.getElementById('outMarkdown').value = markdownLinks.join(' | ');
            document.getElementById('outHtml').value = htmlLinks.join(' ');
            document.getElementById('outText').value = simpleTexts.join('\n');
        }

        // Modern Clipboard Copy with Toast notification
        function copyText(elementId, btnElement) {
            const textarea = document.getElementById(elementId);
            if (!textarea.value.trim()) {
                showToast('Nothing to copy!', true);
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    showToast('Copied to clipboard!');
                    triggerButtonFeedback(btnElement);
                }).catch(() => {
                    fallbackCopy(textarea, btnElement);
                });
            } else {
                fallbackCopy(textarea, btnElement);
            }
        }

        // Fallback copy using execCommand
        function fallbackCopy(textarea, btnElement) {
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Copied to clipboard!');
                triggerButtonFeedback(btnElement);
            } catch (err) {
                showToast('Failed to copy text', true);
            }
        }

        // Visual feedback on button click
        function triggerButtonFeedback(btn) {
            if (!btn) return;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            btn.classList.add('text-emerald-500');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('text-emerald-500');
            }, 2000);
        }

        // Toast Notification Banner state variable
        let toastTimeoutId = null;

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            if (isError) {
                toast.classList.remove('border-slate-700');
                toast.classList.add('border-rose-500');
            } else {
                toast.classList.remove('border-rose-500');
                toast.classList.add('border-slate-700');
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (toastTimeoutId) clearTimeout(toastTimeoutId);

            toastTimeoutId = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Run generation on load
        window.onload = function() {
            generateLinks();
        };
    </script>
</body>
</html>
