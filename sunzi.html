二、 〈始計篇〉白話翻譯與核心分析
孫武在〈始計篇〉中指出，戰爭是國家的大事（「兵者，國之大事，死生之地，存亡之道，不可不察也」），必須從五個基本條件（五事）和七個對比面向（七計）去審慎考察與計算 [03:51]。

道：民眾與君主是否有共同的意志，令民眾願意跟隨生死與共，而不怕危險 [04:20]。在現代可引申為「願景與利益是否一致」（例如公司改革或政府政策，是否照顧到各方利益）。
天：自然與時間條件，即「時機」（天時） [04:32]。
地：戰場的遠近、地形的險易與廣闊（地利） [04:39]。
將：將領是否具備「智、信、仁、勇、嚴」五種質素 [04:50]。
法：軍隊的組織編制、各級官吏的職責、以及軍需物資的供應與使用制度 [04:56]。

2. 七計（敵我雙方的具體條件比拼）
在開戰前，必須透過客觀計算和比較敵我雙方：

哪一方的君主（領導）更能得到民眾認同？ [05:27]
哪一方的將領更有能力？ [05:32]
哪一方佔有更有利的天時與地利？ [05:34]
哪一方的法令執行得更徹底？ [05:36]
哪一方的軍隊力量更強？ [05:39]
哪一方的士兵訓練更精良？ [05:41]
哪一方的賞罰更嚴明？ [05:44]
透過這七個方面的比較，就能夠預先判斷誰會贏、誰會輸 [05:47]。

3. 兵者詭道也
「故能而示之不能，用而示之不用，近而示之遠，遠而示之近」 [06:29]。作戰充滿欺騙與迷惑行為：有能力要向敵人展示自己沒有能力；要打的時候展示自己不打；敵人貪圖利益就用利益引誘；敵人混亂就趁機攻擊；敵人實力強大就要暫時避開等 [06:38]。但這些手段必須根據實際情況靈活決定，不能死守固定方法 [07:23]。

三、 孫子兵法的六步思考框架
主持人將〈始計篇〉的邏輯提煉成一個適用於任何重大競爭、衝突或選擇前的六步思考框架 [08:09]：

第一步（道/事）：這場仗（或這個局）值不值得打？（分析代價與政治目的） [08:31]
須反問自己四個問題：我想得到什麼？我輸了會失去什麼？就算贏了要付出什麼代價？有沒有不打也能達成目的的方法？ [09:10]
第二步（勝負判斷）：憑什麼贏？（評估敵我客觀條件） [08:33]
第三步（七計對比）：自己比對方強在哪裡？哪裡不如對方？ [08:33]
第四步（形）：如果真有優勢，怎樣進一步放大自己的優勢，或改變戰場格局？ [08:37]
第五步（詭道）：如何迷惑對方，令對方判斷錯誤？ [08:37]
第六步（妙算與決策）：經過全面計算與深思熟慮後，最終決定開不開戰 [08:41]。

四、 現代應用實例拆解
1. 國際政治實例（俄烏戰爭與美國對伊朗）
俄烏戰爭：俄羅斯擁有比烏克蘭龐大的軍事力量，但如果只問「能不能打贏」是相當薄弱的 [10:48]。俄羅斯發動全面入侵前，是否認真計算過政治目的與付出的軍事、經濟、盟友團結、長期消耗等巨大代價？如果沒有想清楚就發動戰爭，最終往往會陷入困境 [11:35]。

國際法與理性決策：大國不能僅因自身在軍事上有能力、或感到安全受威脅就隨意開戰。孫子兵法並不是叫人「強就不准打」或「永遠退縮」，而是提醒領袖必須計算清楚成本、平民傷亡、經濟代價以及最壞情況 [14:48]。

有沒有人預見風險（情報與分析部門）。
壞消息能不能順利傳遞到最高層（組織制度會否懲罰說真話的人、護短或容納小人）。
最高決策者是否固執，願不願意聽取相反意見並改變判斷 [18:10]。

商業競爭（如價格戰）：對手減價，不代表盲目跟隨。必須計算市場是否值得、利潤空間、要燒多少錢、打贏後的長遠效益，甚至能否跳出價格戰 [18:43]。

AI 對創作者的衝擊：AI 能在幾分鐘內生成大量內容、圖片、配音 [00:27]。創作者若選擇鬥快、鬥平、盲目增加產量（如瘋狂做 Shorts），是在跟 AI 的絕對優勢硬碰，這是極不理智的做法 [21:21]。

轉變戰場：創作者不應與 AI 鬥資訊搬運，而應該提供判斷、獨特觀點、個人世界觀以及思考框架。觀眾聽你講不是因為你是 AI，而是因為你是「人」 [22:01]。

3. 職場政治
職場上被人搶功勞，最直覺的反反應往往是跟對方正面衝突（吵架、爭辯）。但如果用孫子兵法思考，首先要問你的目的是什麼？（是想要出政績、保護成果、建立長期信用，還是讓老細知道項目是誰做的？） [23:02]

公開撕破臉往往成本最高。若目的是讓老細知道貢獻，可以透過定期向老細清晰汇报進度（Report）來達成，而不是在公司內部搞得烏煙瘴氣，讓自己被老闆視為「麻煩人物」 [23:48]。

政府推行延後退休年齡政策，從政府財政角度看是合理的，但若只看宏觀數據，會忽略成本集中與利益分散的問題 [27:31]。

  { id:2,  name:"作戰篇", youtube:"https://www.youtube.com/watch?v=E2sqRZtyQIg",
    original:`孫子曰：凡用兵之法，馳車千駟，革車千乘，帶甲十萬，千里饋糧，則內外之費，賓客之用，膠漆之材，車甲之奉，日費千金，然後十萬之師舉矣。其用戰也，貴勝，久則鈍兵挫銳，攻城則力屈，久暴師則國用不足。夫鈍兵挫銳，屈力殫貨，則諸侯乘其弊而起，雖有智者，不能善其後矣。故兵聞拙速，未睹巧之久也。夫兵久而國利者，未之有也。故不盡知用兵之害者，則不能盡知用兵之利也。

善用兵者，役不再籍，糧不三載；取用於國，因糧於敵，故軍食可足也。

國之貧於師者遠輸，遠輸則百姓貧；近師者貴賣，貴賣則百姓財竭，財竭則急於丘役。力屈財殫，中原內虛於家。百姓之費，十去其七；公家之費，破車罷馬，甲冑矢弩，戟楯蔽櫓，丘牛大車，十去其六。

故智將務食於敵，食敵一鍾，當吾二十鍾；萁稈一石，當吾二十石。

故殺敵者，怒也；取敵之利者，貨也。故車戰，得車十乘以上，賞其先得者，而更其旌旗。車雜而乘之，卒善而養之，是謂勝敵而益強。

故兵貴勝，不貴久。故知兵之將，民之司命，國家安危之主也。` },
  { id:3,  name:"謀攻篇", youtube:"https://www.youtube.com/watch?v=Jg9SLMkcq9Y",
    original:`孫子曰：凡用兵之法，全國為上，破國次之；全軍為上，破軍次之；全旅為上，破旅次之；全卒為上，破卒次之；全伍為上，破伍次之。是故百戰百勝，非善之善者也；不戰而屈人之兵，善之善者也。

故上兵伐謀，其次伐交，其次伐兵，其下攻城。攻城之法，為不得已。修櫓轒轀，具器械，三月而後成；距闉，又三月而後已。將不勝其忿，而蟻附之，殺士三分之一，而城不拔者，此攻之災也。

故善用兵者，屈人之兵而非戰也，拔人之城而非攻也，毀人之國而非久也，必以全爭於天下，故兵不頓而利可全，此謀攻之法也。

故用兵之法，十則圍之，五則攻之，倍則分之，敵則能戰之，少則能守之，不若則能避之。故小敵之堅，大敵之擒也。

夫將者，國之輔也。輔周則國必強，輔隙則國必弱。

故君之所以患於軍者三：不知軍之不可以進而謂之進，不知軍之不可以退而謂之退，是為縻軍；不知三軍之事，而同三軍之政，則軍士惑矣；不知三軍之權，而同三軍之任，則軍士疑矣。三軍既惑且疑，則諸侯之難至矣，是謂亂軍引勝。

故知勝有五：知可以戰與不可以戰者勝，識衆寡之用者勝，上下同欲者勝，以虞待不虞者勝，將能而君不御者勝。此五者，知勝之道也。

故曰：知彼知己，百戰不殆；不知彼而知己，一勝一負；不知彼不知己，每戰必殆。` },
  { id:4,  name:"軍形篇", youtube:"https://www.youtube.com/watch?v=3qUx_3pXZGE",
    original:`孫子曰：昔之善戰者，先為不可勝，以待敵之可勝。不可勝在己，可勝在敵。故善戰者，能為不可勝，不能使敵之必可勝。故曰：勝可知，而不可為。

不可勝者，守也；可勝者，攻也。守則不足，攻則有餘。善守者，藏於九地之下；善攻者，動於九天之上，故能自保而全勝也。

見勝不過衆人之所知，非善之善者也；戰勝而天下曰善，非善之善者也。故舉秋毫不為多力，見日月不為明目，聞雷霆不為聰耳。

古之所謂善戰者，勝於易勝者也。故善戰者之勝也，無智名，無勇功。故其戰勝不忒。不忒者，其所措必勝，勝已敗者也。故善戰者，立於不敗之地，而不失敵之敗也。是故勝兵先勝而後求戰，敗兵先戰而後求勝。善用兵者，修道而保法，故能為勝敗之政。

兵法：一曰度，二曰量，三曰數，四曰稱，五曰勝。地生度，度生量，量生數，數生稱，稱生勝。故勝兵若以鎰稱銖，敗兵若以銖稱鎰。勝者之戰民也，若決積水於千仞之溪者，形也。` },
  { id:5,  name:"兵勢篇", youtube:"https://www.youtube.com/watch?v=rm0oIt-lNqM",
    original:`孫子曰：凡治衆如治寡，分數是也；鬥衆如鬥寡，形名是也；三軍之衆，可使必受敵而無敗者，奇正是也；兵之所加，如以碫投卵者，虛實是也。

凡戰者，以正合，以奇勝。故善出奇者，無窮如天地，不竭如江海。終而復始，日月是也。死而復生，四時是也。聲不過五，五聲之變，不可勝聽也；色不過五，五色之變，不可勝觀也；味不過五，五味之變，不可勝嘗也；戰勢不過奇正，奇正之變，不可勝窮也。奇正相生，如循環之無端，孰能窮之哉？

激水之疾，至於漂石者，勢也；鷙鳥之疾，至於毀折者，節也。故善戰者，其勢險，其節短。勢如彍弩，節如發機。

紛紛紜紜，鬥亂而不可亂也；渾渾沌沌，形圓而不可敗也。亂生於治，怯生於勇，弱生於強。治亂，數也；勇怯，勢也；強弱，形也。

故善動敵者，形之，敵必從之；予之，敵必取之。以利動之，以卒待之。

故善戰者，求之於勢，不責於人，故能擇人而任勢。任勢者，其戰人也，如轉木石。木石之性，安則靜，危則動，方則止，圓則行。故善戰人之勢，如轉圓石於千仞之山者，勢也。` },
  { id:6,  name:"虛實篇", youtube:"https://www.youtube.com/watch?v=XQi4jFwGTC0",
    original:`孫子曰：凡先處戰地而待敵者佚，後處戰地而趨戰者勞。故善戰者，致人而不致於人。

能使敵自至者，利之也；能使敵不得至者，害之也。故敵佚能勞之，飽能饑之，安能動之。出其所不趨，趨其所不意。

行千里而不勞者，行於無人之地也。攻而必取者，攻其所不守也；守而必固者，守其所不攻也。故善攻者，敵不知其所守；善守者，敵不知其所攻。微乎微乎！至於無形；神乎神乎！至於無聲，故能為敵之司命。

進而不可禦者，沖其虛也；退而不可追者，速而不可及也。故我欲戰，敵雖高壘深溝，不得不與我戰者，攻其所必救也；我不欲戰，雖畫地而守之，敵不得與我戰者，乖其所之也。

故形人而我無形，則我專而敵分。我專為一，敵分為十，是以十攻其一也，則我衆而敵寡。能以衆擊寡者，則吾之所與戰者，約矣。吾所與戰之地不可知，不可知，則敵所備者多，敵所備者多，則吾之所與戰者寡矣。故備前則後寡，備後則前寡，備左則右寡，備右則左寡，無所不備，則無所不寡。寡者，備人者也；衆者，使人備己者也。

故知戰之地，知戰之日，則可千里而會戰；不知戰之地，不知戰之日，則左不能救右，右不能救左，前不能救後，後不能救前，而況遠者數十里，近者數里乎！以吾度之，越人之兵雖多，亦奚益於勝敗哉！故曰：勝可擅也。敵雖衆，可使無鬥。

故策之而知得失之計，作之而知動靜之理，形之而知死生之地，角之而知有餘不足之處。故形兵之極，至於無形。無形，則深間不能窺，智者不能謀。因形而措勝於衆，衆不能知。人皆知我所以勝之形，而莫知吾所以制勝之形。故其戰勝不復，而應形於無窮。

夫兵形象水，水之行，避高而趨下；兵之勝，避實而擊虛。水因地而制行，兵因敵而制勝。故兵無成勢，無恆形，能因敵變化而取勝者，謂之神。故五行無常勝，四時無常位，日有短長，月有死生。` },
  { id:7,  name:"軍爭篇", youtube:"https://www.youtube.com/watch?v=qVjLZP7UpmQ",
    original:`孫子曰：凡用兵之法，將受命於君，合軍聚衆，交和而舍，莫難於軍爭。軍爭之難者，以迂為直，以患為利。故迂其途，而誘之以利，後人發，先人至，此知迂直之計者也。

故軍爭為利，軍爭為危。舉軍而爭利，則不及；委軍而爭利，則輜重捐。是故卷甲而趨，日夜不處，倍道兼行，百里而爭利，則擒三軍將，勁者先，疲者後，其法十一而至；五十里而爭利，則蹶上軍將，其法半至；三十里而爭利，則三分之二至。是故軍無輜重則亡，無糧食則亡，無委積則亡。故不知諸侯之謀者，不能豫交；不知山林、險阻、沮澤之形者，不能行軍；不用鄉導者，不能得地利。

故兵以詐立，以利動，以分合為變者也。故其疾如風，其徐如林，侵掠如火，不動如山，難知如陰，動如雷震。掠鄉分衆，廓地分利，懸權而動。先知迂直之計者勝，此軍爭之法也。

《軍政》曰：「言不相聞，故為金鼓；視不相見，故為旌旗。」夫金鼓旌旗者，所以一民之耳目也。民既專一，則勇者不得獨進，怯者不得獨退，此用衆之法也。故夜戰多金鼓，晝戰多旌旗，所以變人之耳目也。

三軍可奪氣，將軍可奪心。是故朝氣銳，晝氣惰，暮氣歸。故善用兵者，避其銳氣，擊其惰歸，此治氣者也；以治待亂，以靜待嘩，此治心者也；以近待遠，以佚待勞，以飽待饑，此治力者也；無邀正正之旗，無擊堂堂之陣，此治變者也。

故用兵之法，高陵勿向，背丘勿逆，佯北勿從，銳卒勿攻，餌兵勿食，歸師勿遏，圍師必闕，窮寇勿迫，此用兵之法也。` },
  { id:8,  name:"九變篇", youtube:"https://www.youtube.com/watch?v=Q7m-ntehelQ",
    original:`孫子曰：凡用兵之法，將受命於君，合軍聚眾。圮地無舍，衢地合交，絕地無留，圍地則謀，死地則戰。途有所不由，軍有所不擊，城有所不攻，地有所不爭，君命有所不受。故將通於九變之利者，知用兵矣；將不通於九變之利，雖知地形，不能得地之利矣；治兵不知九變之術，雖知地利，不能得人之用矣。

是故智者之慮，必雜於利害，雜於利而務可信也，雜於害而患可解也。是故屈諸侯者以害，役諸侯者以業，趨諸侯者以利。

故用兵之法，無恃其不來，恃吾有以待之；無恃其不攻，恃吾有所不可攻也。

故將有五危︰必死，可殺也﹔必生，可虜也﹔忿速，可侮也﹔廉潔，可辱也﹔愛民，可煩也。凡此五者，將之過也，用兵之災也。覆軍殺將，必以五危，不可不察也。` },
  { id:9,  name:"行軍篇", youtube:"https://www.youtube.com/watch?v=83-_-Abo-G4",
    original:`孫子曰：凡處軍相敵，絕山依谷，視生處高，戰隆無登，此處山之軍也。絕水必遠水，客絕水而來，勿迎之於水內，令半濟而擊之，利；欲戰者，無附於水而迎客，視生處高，無迎水流，此處水上之軍也。絕斥澤，惟亟去無留，若交軍於斥澤之中，必依水草，而背衆樹，此處斥澤之軍也。平陸處易，而右背高，前死後生，此處平陸之軍也。凡此四軍之利，黃帝之所以勝四帝也。

凡軍好高而惡下，貴陽而賤陰，養生而處實，軍無百疾，是謂必勝。丘陵堤防，必處其陽，而右背之，此兵之利，地之助也。上雨，水沫至，欲涉者，待其定也。

凡地有絕澗，遇天井、天牢、天羅、天陷、天隙，必亟去之，勿近也。吾遠之，敵近之；吾迎之，敵背之。軍旁有險阻、潢井、葭葦、林木、蘙薈者，必謹覆索之，此伏奸之所處也。

敵近而靜者，恃其險也；遠而挑戰者，欲人之進也；其所居易者，利也；衆樹動者，來也；衆草多障者，疑也；鳥起者，伏也；獸駭者，覆也；塵高而銳者，車來也；卑而廣者，徒來也；散而條達者，樵採也；少而往來者，營軍也；辭卑而益備者，進也；辭強而進驅者，退也；輕車先出，居其側者，陣也；無約而請和者，謀也；奔走而陳兵者，期也；半進半退者，誘也；杖而立者，饑也；汲而先飲者，渴也；見利而不進者，勞也；鳥集者，虛也；夜呼者，恐也；軍擾者，將不重也；旌旗動者，亂也；吏怒者，倦也；粟馬肉食，軍無懸缻，而不返其舍者，窮寇也；諄諄翕翕，徐與人言者，失衆也；數賞者，窘也；數罰者，困也；先暴而後畏其衆者，不精之至也；來委謝者，欲休息也。兵怒而相迎，久而不合，又不相去，必謹察之。

故兵非貴益多也，惟無武進，足以併力、料敵、取人而已。夫惟無慮而易敵者，必擒於人。

卒未親附而罰之，則不服，不服則難用也。卒已親附而罰不行，則不可用也。故令之以文，齊之以武，是謂必取。令素行以教其民，則民服；令素不行以教其民，則民不服。令素行者，與衆相得也。` },
  { id:10, name:"地形篇", youtube:"https://www.youtube.com/watch?v=YO65ftDoRq8",
    original:`孫子曰：凡地形有通者、有掛者、有支者、有隘者、有險者、有遠者。我可以往，彼可以來，曰通。通形者，先居高陽，利糧道，以戰則利。可以往，難以返，曰掛。掛形者，敵無備，出而勝之；敵若有備，出而不勝，難以返，不利。我出而不利，彼出而不利，曰支。支形者，敵雖利我，我無出也，引而去之，令敵半出而擊之，利。隘形者，我先居之，必盈之以待敵。若敵先居之，盈而勿從，不盈而從之。險形者，我先居之，必居高陽以待敵；若敵先居之，引而去之，勿從也。遠形者，勢均，難以挑戰，戰而不利。凡此六者，地之道也，將之至任，不可不察也。

故兵有走者、有弛者、有陷者、有崩者、有亂者、有北者。凡此六者，非天之災，將之過也。夫勢均，以一擊十，曰走；卒強吏弱，曰弛；吏強卒弱，曰陷；大吏怒而不服，遇敵懟而自戰，將不知其能，曰崩；將弱不嚴，教道不明，吏卒無常，陳兵縱橫，曰亂；將不能料敵，以少合衆，以弱擊強，兵無選鋒，曰北。凡此六者，敗之道也，將之至任，不可不察也。

夫地形者，兵之助也。料敵制勝，計險厄遠近，上將之道也。知此而用戰者必勝，不知此而用戰者必敗。故戰道必勝，主曰無戰，必戰可也；戰道不勝，主曰必戰，無戰可也。是故進不求名，退不避罪，唯民是保，而利合於主，國之寶也。

視卒如嬰兒，故可以與之赴深溪；視卒如愛子，故可與之俱死。厚而不能使，愛而不能令，亂而不能治，譬若驕子，不可用也。

知吾卒之可以擊，而不知敵之不可擊，勝之半也；知敵之可擊，而不知吾卒之不可以擊，勝之半也；知敵之可擊，知吾卒之可以擊，而不知地形之不可以戰，勝之半也。故知兵者，動而不迷，舉而不窮。故曰：知彼知己，勝乃不殆；知天知地，勝乃可全。` },
  { id:11, name:"九地篇", youtube:"https://www.youtube.com/watch?v=AJT2N7KX8fY",
    original:`孫子曰：凡用兵之法，有散地，有輕地，有爭地，有交地，有衢地，有重地，有圮地，有圍地，有死地。諸侯自戰其地者，為散地；入人之地而不深者，為輕地；我得則利，彼得亦利者，為爭地；我可以往，彼可以來者，為交地；諸侯之地三屬，先至而得天下之衆者，為衢地；入人之地深，背城邑多者，為重地；山林、險阻、沮澤，凡難行之道者，為圮地；所由入者隘，所從歸者迂，彼寡可以擊吾之衆者，為圍地；疾戰則存，不疾戰則亡者，為死地。是故散地則無戰，輕地則無止，爭地則無攻，交地則無絕，衢地則合交，重地則掠，圮地則行，圍地則謀，死地則戰。

所謂古之善用兵者，能使敵人前後不相及，衆寡不相恃，貴賤不相救，上下不相收，卒離而不集，兵合而不齊。合於利而動，不合於利而止。敢問︰「敵衆整而將來，待之若何？」曰：「先奪其所愛，則聽矣。」故兵之情主速，乘人之不及，由不虞之道，攻其所不戒也。

凡為客之道，深入則專，主人不克。掠於饒野，三軍足食。謹養而勿勞，併氣積力，運兵計謀，為不可測。投之無所往，死且不北。死焉不得，士人盡力。兵士甚陷則不懼，無所往則固，深入則拘，不得已則鬥。是故其兵不修而戒，不求而得，不約而親，不令而信。禁祥去疑，至死無所之。吾士無餘財，非惡貨也；無餘命，非惡壽也。令發之日，士卒坐者涕沾襟，偃臥者淚交頤。投之無所往者，則諸、劌之勇也。

故善用兵者，譬如率然。率然者，常山之蛇也。擊其首則尾至，擊其尾則首至，擊其中則首尾俱至。敢問︰「兵可使如率然乎？」曰︰「可。夫吳人與越人相惡也，當其同舟而濟。遇風，其相救也，如左右手。」是故方馬埋輪，未足恃也；齊勇如一，政之道也；剛柔皆得，地之理也。故善用兵者，攜手若使一人，不得已也。

將軍之事，靜以幽，正以治。能愚士卒之耳目，使之無知；易其事，革其謀，使人無識；易其居，迂其途，使人不得慮。帥與之期，如登高而去其梯；帥與之深入諸侯之地，而發其機，焚舟破釜，若驅群羊。驅而往，驅而來，莫知所之。聚三軍之衆，投之於險，此謂將軍之事也。九地之變，屈伸之利，人情之理，不可不察也。

凡為客之道，深則專，淺則散。去國越境而師者，絕地也；四達者，衢地也；入深者，重地也；入淺者，輕地也；背固前隘者，圍地也；無所往者，死地也。是故散地，吾將一其志；輕地，吾將使之屬；爭地，吾將趨其後；交地，吾將謹其守；衢地，吾將固其結；重地，吾將繼其食；圮地，吾將進其途；圍地，吾將塞其闕；死地，吾將示之以不活。故兵之情：圍則禦，不得已則鬥，過則從。

是故不知諸侯之謀者，不能豫交；不知山林、險阻、沮澤之形者，不能行軍；不用鄉導者，不能得地利。四五者，不知一，非霸王之兵也。夫霸王之兵，伐大國，則其衆不得聚；威加於敵，則其交不得合。是故不爭天下之交，不養天下之權，信己之私，威加於敵，則其城可拔，其國可隳。施無法之賞，懸無政之令。犯三軍之衆，若使一人。犯之以事，勿告以言；犯之以利，勿告以害。投之亡地然後存，陷之死地然後生。夫衆陷於害，然後能為勝敗。故為兵之事，在於佯順敵之意，併敵一向，千里殺將，是謂巧能成事者也。

是故政舉之日，夷關折符，無通其使；厲於廊廟之上，以誅其事。敵人開闔，必亟入之，先其所愛，微與之期，踐墨隨敵，以決戰事。是故始如處女，敵人開戶；後如脫兔，敵不及拒。` },
  { id:12, name:"火攻篇", youtube:"https://www.youtube.com/watch?v=qX_rri7ul2s",
    original:`孫子曰：凡火攻有五：一曰火人，二曰火積，三曰火輜，四曰火庫，五曰火隊。行火必有因，煙火必素具。發火有時，起火有日。時者，天之燥也。日者，月在箕、壁、翼、軫也。凡此四宿者，風起之日也。

凡火攻，必因五火之變而應之：火發於內，則早應之於外；火發而其兵靜者，待而勿攻，極其火力，可從而從之，不可從則止；火可發於外，無待於內，以時發之；火發上風，無攻下風；晝風久，夜風止。凡軍必知有五火之變，以數守之。故以火佐攻者明，以水佐攻者強。水可以絕，不可以奪。

夫戰勝攻取，而不修其功者凶，命曰「費留」。故曰：明主慮之，良將修之，非利不動，非得不用，非危不戰。主不可以怒而興師，將不可以慍而致戰。合於利而動，不合於利而止。怒可以復喜，慍可以復悅，亡國不可以復存，死者不可以復生。故明主慎之，良將警之，此安國全軍之道也。` },
  { id:13, name:"用間篇", youtube:"https://www.youtube.com/watch?v=azQBD66gMIg",
    original:`孫子曰：凡興師十萬，出征千里，百姓之費，公家之奉，日費千金，內外騷動，怠於道路，不得操事者，七十萬家。相守數年，以爭一日之勝，而愛爵祿百金，不知敵之情者，不仁之至也，非人之將也，非主之佐也，非勝之主也。故明君賢將，所以動而勝人，成功出於眾者，先知也。先知者，不可取於鬼神，不可象於事，不可驗於度，必取於人，知敵之情者也。

故用間有五：有鄉間，有內間，有反間，有死間，有生間。五間俱起，莫知其道，是謂「神紀」，人君之寶也。鄉間者，因其鄉人而用之；內間者，因其官人而用之；反間者，因其敵間而用之；死間者，為誑事於外，令吾間知之，而傳於敵間也；生間者，反報也。

故三軍之事，莫親於間，賞莫厚於間，事莫密於間，非聖智不能用間，非仁義不能使間，非微妙不能得間之實。微哉！微哉！無所不用間也。間事未發而先聞者，間與所告者皆死。

凡軍之所欲擊，城之所欲攻，人之所欲殺，必先知其守將、左右、謁者、門者、舍人之姓名，令吾間必索知之。必索敵人之間來間我者，因而利之，導而舍之，故反間可得而用也；因是而知之，故鄉間、內間可得而使也；因是而知之，故死間為誑事，可使告敵；因是而知之，故生間可使如期。五間之事，主必知之，知之必在於反間，故反間不可不厚也。` },
];

const CN_NUM = ["","一","二","三","四","五","六","七","八","九","十","十一","十二","十三"];
const STORAGE_KEY = "sunzi_bingfa_content_v1";

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveStore(store){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}

let store = loadStore();
let activeId = 1;

function getField(id, field, fallback){
  if(store[id] && store[id][field] !== undefined) return store[id][field];
  return fallback !== undefined ? fallback : "";
}
function setField(id, field, value){
  if(!store[id]) store[id] = {};
  store[id][field] = value;
  saveStore(store);
}

function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function renderNav(){
  const nav = document.getElementById("navScroll");
  nav.innerHTML = "";
  CHAPTERS.forEach(ch => {
    const el = document.createElement("button");
    el.className = "slip" + (ch.id === activeId ? " active" : "");
    el.innerHTML = `<span class="num">${String(ch.id).padStart(2,'0')}</span>${ch.name}`;
    el.addEventListener("click", () => {
      activeId = ch.id;
      renderNav();
      renderMain();
    });
    nav.appendChild(el);
  });
}

function blockTemplate({icon, title, en, bodyHtml}){
  return `
    <section class="block">
      <div class="block-head">
        <div class="mark">${icon}</div>
        <h2>${title}</h2>
        <div class="en">${en}</div>
      </div>
      <div class="block-body">${bodyHtml}</div>
    </section>
  `;
}

function renderMain(){
  const chapter = CHAPTERS.find(c => c.id === activeId);
  const main = document.getElementById("main");

  const interpretation = getField(chapter.id, "interpretation", "");
  const youtube = getField(chapter.id, "youtube", chapter.youtube || "");
  const original = getField(chapter.id, "original", chapter.original || "");
  const english = getField(chapter.id, "english", "");
  const huashan = getField(chapter.id, "huashan", "");
  const vid = ytId(youtube);

  main.innerHTML = `
    <div class="chapter-head">
      <div class="cnum">${CN_NUM[chapter.id]}</div>
      <div class="ctitle">${chapter.name}</div>
      <div class="csub">第 ${chapter.id} / 13 篇</div>
    </div>

    ${blockTemplate({
      icon:"解", title:"今日解讀", en:"Modern Interpretation",
      bodyHtml:`
        <textarea class="editor" data-field="interpretation" placeholder="在此輸入本篇的現代解讀 / 應用心得...">${escapeHtml(interpretation)}</textarea>
        <div class="save-note" data-note="interpretation"></div>
      `
    })}

    ${blockTemplate({
      icon:"▶", title:"YouTube 影片", en:"Video Reference",
      bodyHtml:`
        <div class="yt-row">
          <input class="url-input" type="text" data-field="youtube" placeholder="貼上 YouTube 連結..." value="${escapeAttr(youtube)}">
          <button class="btn" data-action="loadVideo">載入影片</button>
        </div>
        <div class="yt-embed ${vid ? 'show' : ''}" id="ytEmbed">
          ${vid ? `<iframe src="https://www.youtube-nocookie.com/embed/${vid}" allowfullscreen></iframe>` : ""}
        </div>
        ${!vid ? `<div class="yt-empty">尚未載入影片，請按上方「載入影片」。</div>` : ""}
      `
    })}

    ${blockTemplate({
      icon:"原", title:"原文《孫子兵法》", en:"Original Chinese Text",
      bodyHtml:`
        <textarea class="editor original" data-field="original" placeholder="在此輸入《${chapter.name}》原文...">${escapeHtml(original)}</textarea>
        <div class="save-note" data-note="original"></div>
      `
    })}

    ${blockTemplate({
      icon:"E", title:"英文版 The Art of War", en:"English Translation",
      bodyHtml:`
        <textarea class="editor" data-field="english" placeholder="Enter the English translation (Art of War) for this chapter...">${escapeHtml(english)}</textarea>
        <div class="save-note" data-note="english"></div>
      `
    })}

    ${blockTemplate({
      icon:"華", title:"華杉講透《孫子兵法》", en:"Hua Shan's Commentary",
      bodyHtml:`
        <textarea class="editor" data-field="huashan" placeholder="在此輸入華杉講透《孫子兵法》相關內容 / 筆記...">${escapeHtml(huashan)}</textarea>
        <div class="save-note" data-note="huashan"></div>
      `
    })}
  `;

  // wire up textareas -> autosave
  main.querySelectorAll("textarea.editor[data-field]").forEach(ta => {
    ta.addEventListener("input", () => {
      setField(chapter.id, ta.dataset.field, ta.value);
      flashNote(ta.dataset.field);
    });
  });

  // youtube url input
  const urlInput = main.querySelector('input[data-field="youtube"]');
  urlInput.addEventListener("input", () => {
    setField(chapter.id, "youtube", urlInput.value);
  });

  main.querySelector('[data-action="loadVideo"]').addEventListener("click", () => {
    const url = urlInput.value.trim();
    setField(chapter.id, "youtube", url);
    renderMain();
  });
}

function flashNote(field){
  const note = document.querySelector(`.save-note[data-note="${field}"]`);
  if(!note) return;
  note.textContent = "已自動儲存 ✓";
  clearTimeout(note._t);
  note._t = setTimeout(() => { note.textContent = ""; }, 1400);
}

function escapeHtml(str){
  return (str || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(str){
  return (str || "").replace(/"/g,"&quot;");
}

renderNav();
renderMain();
</script>
</body>
</html>
