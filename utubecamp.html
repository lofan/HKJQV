    // 2. STATE MANAGEMENT
    let state = {
      searchQuery: "",
      selectedCategory: "All",
      currentTab: "discover", // 'discover' | 'saved'
      savedIds: new Set(JSON.parse(localStorage.getItem('campvibe_saved_channels') || '[]'))
    };

    // 3. UTILITY FUNCTIONS
    function getLatestVideosUrl(baseUrl) {
      if (!baseUrl) return "#";
      const cleanUrl = baseUrl.replace(/\/+$/, '').replace(/\/videos$/, '');
      return `${cleanUrl}/videos`;
    }

    function saveToStorage() {
      localStorage.setItem('campvibe_saved_channels', JSON.stringify(Array.from(state.savedIds)));
    }

    function toggleSave(id) {
      if (state.savedIds.has(id)) {
        state.savedIds.delete(id);
      } else {
        state.savedIds.add(id);
      }
      saveToStorage();
      render();
    }

    function switchTab(tab) {
      state.currentTab = tab;
      
      const tabDiscoverBtn = document.getElementById('tabDiscover');
      const tabSavedBtn = document.getElementById('tabSaved');

      if (tab === 'discover') {
        tabDiscoverBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        tabSavedBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-gray-200 transition-all flex items-center gap-1.5";
        document.getElementById('viewTitle').innerHTML = `<i data-lucide="compass" class="w-4 h-4 text-emerald-400"></i><span>Discover Channels</span>`;
      } else {
        tabSavedBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        tabDiscoverBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-gray-200 transition-all flex items-center gap-1.5";
        document.getElementById('viewTitle').innerHTML = `<i data-lucide="bookmark" class="w-4 h-4 text-emerald-400"></i><span>Saved Favorites</span>`;
      }

      render();
    }

    function setCategory(cat) {
      state.selectedCategory = cat;
      render();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = "";
      state.searchQuery = "";
      document.getElementById('clearSearchBtn').classList.add('hidden');
      render();
    }

    function resetFilters() {
      state.selectedCategory = "All";
      clearSearch();
    }

    // 4. FILTERING LOGIC
    function getFilteredChannels() {
      return CHANNELS.filter(item => {
        // Tab Check
        if (state.currentTab === 'saved' && !state.savedIds.has(item.id)) {
          return false;
        }

        // Category Check
        if (state.selectedCategory !== 'All' && item.category !== state.selectedCategory) {
          return false;
        }

        // Search Query Check
        if (state.searchQuery.trim() !== '') {
          const q = state.searchQuery.toLowerCase();
          const matchName = item.name.toLowerCase().includes(q);
          const matchHandle = item.handle.toLowerCase().includes(q);
          const matchVibe = item.vibe.toLowerCase().includes(q);
          const matchDesc = item.description.toLowerCase().includes(q);
          const matchTags = item.tags.some(t => t.toLowerCase().includes(q));
          
          return matchName || matchHandle || matchVibe || matchDesc || matchTags;
        }

        return true;
      });
    }

    // 5. RENDER FUNCTIONS
    function renderCategories() {
      const categories = ["All", ...new Set(CHANNELS.map(c => c.category))];
      const categoryBar = document.getElementById('categoryBar');

      categoryBar.innerHTML = categories.map(cat => {
        const isActive = state.selectedCategory === cat;
        const activeClass = isActive 
          ? "bg-emerald-500 text-gray-950 font-semibold shadow-lg shadow-emerald-500/20" 
          : "bg-gray-900 text-gray-400 hover:text-gray-200 hover:bg-gray-800 border border-gray-800/80";

        return `
          <button 
            onclick="setCategory('${cat}')" 
            class="px-3 py-1 rounded-full text-xs shrink-0 transition-all ${activeClass}"
          >
            ${cat}
          </button>
        `;
      }).join('');
    }

      document.getElementById('discoverCount').innerText = CHANNELS.length;
      document.getElementById('savedCount').innerText = state.savedIds.size;
      document.getElementById('resultCountText').innerText = `Showing ${filtered.length} creators`;

        grid.innerHTML = "";
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

                    ${ch.name.charAt(0)}
                  </div>
                  <div>
                    <h3 class="font-bold text-gray-100 text-base group-hover:text-emerald-400 transition-colors line-clamp-1">
                      ${ch.name}
                    </h3>
                    <div class="flex items-center gap-2 text-xs text-gray-500">

                    </div>
                  </div>
                </div>

                <!-- Favorite Button -->
                <button 
                  onclick="toggleSave('${ch.id}')"
                  class="p-2 rounded-xl border ${isSaved ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-gray-900 border-gray-800 text-gray-500 hover:text-gray-300'} transition-all shrink-0"
                  title="${isSaved ? 'Remove from Saved' : 'Save Channel'}"
                >
                  <i data-lucide="bookmark" class="w-4 h-4 ${isSaved ? 'fill-emerald-400' : ''}"></i>
                </button>
              </div>

              <!-- Vibe Pill -->
              <div class="mb-3">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-medium">
                  <i data-lucide="sparkles" class="w-3 h-3 text-emerald-400"></i>
                  ${ch.vibe}
                </span>
              </div>

              <!-- Description -->
              <p class="text-xs text-gray-400 leading-relaxed mb-4 line-clamp-3">
                ${ch.description}
              </p>
            </div>

            <!-- Card Bottom: Tags & Action CTA -->
            <div>
              <!-- Tags -->
              <div class="flex flex-wrap gap-1.5 mb-4">
                ${ch.tags.map(tag => `
                  <span class="px-2 py-0.5 rounded-md bg-gray-950 border border-gray-800 text-[10px] text-gray-400">
                    #${tag}
                  </span>
                `).join('')}
              </div>

              <!-- CTA Button -->
              <a 
                href="${latestVideosUrl}" 
                target="_blank" 
                rel="noopener noreferrer"
                class="w-full py-2 px-3 bg-gray-800 hover:bg-emerald-600 text-gray-200 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all duration-200 border border-gray-700/50 hover:border-emerald-500 group/btn"
              >
                <span>Watch Latest Uploads</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5 transition-transform group-hover/btn:translate-x-0.5"></i>
              </a>
            </div>

          </div>
        `;
      }).join('');
    }

    function render() {
      renderCategories();
      renderGrid();
      lucide.createIcons();
    }

    // 6. EVENT LISTENERS
    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (state.searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      render();
    });

    // Initial Launch
    render();
  </script>
</body>
</html>
