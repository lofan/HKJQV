<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JapanesePod101 Complete Video Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab {
            border-bottom: 3px solid #ef4444;
            color: #ef4444;
            font-weight: 600;
        }
        .completed-item {
            opacity: 0.5;
            text-decoration: line-through;
        }

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-red-500 flex items-center gap-2">
                    🇯🇵 JapanesePod101 Master Hub
                </h1>
                <p class="text-xs text-slate-400">Complete URL Collection with Interactive Progress Tracking</p>
            </div>
            
            <!-- Global Search -->
            <div class="w-full md:w-96">
                <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="Search all lessons, kanji, topics..." 
                       class="w-full px-4 py-2 rounded-lg bg-slate-800 text-slate-100 placeholder-slate-400 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="bg-slate-800 border-t border-slate-700">
            <div class="max-w-7xl mx-auto px-4 flex space-x-6 overflow-x-auto text-sm text-slate-300">
                <button onclick="switchTab('all')" id="tab-all" class="py-3 px-1 whitespace-nowrap active-tab">All Lessons</button>
                <button onclick="switchTab('kana')" id="tab-kana" class="py-3 px-1 whitespace-nowrap">Hiragana & Alphabet</button>
                <button onclick="switchTab('kanji')" id="tab-kanji" class="py-3 px-1 whitespace-nowrap">Kanji Lessons</button>
                <button onclick="switchTab('speaking')" id="tab-speaking" class="py-3 px-1 whitespace-nowrap">Speaking Practice</button>
                <button onclick="switchTab('listening')" id="tab-listening" class="py-3 px-1 whitespace-nowrap">Listening & Reading</button>
                <button onclick="switchTab('vocab')" id="tab-vocab" class="py-3 px-1 whitespace-nowrap">Vocab & Quizzes</button>
                <button onclick="switchTab('monthly')" id="tab-monthly" class="py-3 px-1 whitespace-nowrap">Monthly Digests</button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Video Player Sidebar -->
        <div class="lg:col-span-5 order-first lg:order-last">
            <div class="sticky top-32 bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Video Player</h2>
                <div class="relative w-full aspect-video bg-slate-900 rounded-lg overflow-hidden mb-3">
                    <iframe id="videoPlayer" class="w-full h-full" src="https://www.youtube.com/embed/-HXUN6nLQxo" 
                            title="YouTube video player" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen></iframe>
                </div>
                <h3 id="currentVideoTitle" class="font-medium text-slate-900 text-sm line-clamp-2">Here’s how you learn over 1500 Japanese words easily</h3>
            </div>
        </div>

        <!-- Lessons Feed -->
        <div class="lg:col-span-7">
            <div id="lessonContainer" class="space-y-3">
                <!-- Javascript will render all videos here -->
            </div>
        </div>

    </main>

        let currentCategory = 'all';

        function renderLessons() {
            const container = document.getElementById('lessonContainer');
            container.innerHTML = '';

            const filtered = lessons.filter(lesson => {
                return currentCategory === 'all' || lesson.category === currentCategory;
            });

            filtered.forEach((lesson) => {
                const isCompleted = localStorage.getItem(`completed_${lesson.id}`) === 'true';
                
                const card = document.createElement('div');
                card.className = `lesson-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-4 hover:border-slate-300 transition ${isCompleted ? 'completed-item' : ''}`;
                card.setAttribute('data-title', lesson.title.toLowerCase());

                card.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <input type="checkbox" ${isCompleted ? 'checked' : ''} 
                               onchange="toggleComplete('${lesson.id}', this)"
                               class="w-5 h-5 rounded text-red-600 focus:ring-red-500 border-slate-300 cursor-pointer">
                        <span class="text-sm font-medium text-slate-800 truncate cursor-pointer hover:text-red-600"
                              onclick="playVideo('${lesson.id}', '${escapeQuotes(lesson.title)}')">
                            ${lesson.title}
                        </span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="playVideo('${lesson.id}', '${escapeQuotes(lesson.title)}')" 
                                class="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 font-semibold text-xs rounded-lg transition">
                            Play
                        </button>
                        <a href="${lesson.url}" target="_blank" rel="noopener noreferrer" 
                           class="px-2 py-1.5 text-slate-400 hover:text-slate-600 text-xs font-mono" title="Open directly on YouTube">
                            [Link]
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playVideo(videoId, title) {
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            document.getElementById('currentVideoTitle').innerText = title;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleComplete(id, checkbox) {
            localStorage.setItem(`completed_${id}`, checkbox.checked);
            renderLessons();
        }

        function switchTab(category) {
            currentCategory = category;
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById(`tab-${category}`).classList.add('active-tab');
            renderLessons();
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.lesson-card').forEach(card => {
                const title = card.getAttribute('data-title');
                if (title.includes(query)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Initial render
        renderLessons();
    </script>
</body>
</html>
