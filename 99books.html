<style>
  :root{
    --bg:#15110d;
    --bg-2:#1c1712;
    --card:#221c16;
    --card-hover:#2a231b;
    --border:#3a2f22;
    --border-soft:#2c2419;
    --text:#f0e6d2;
    --text-muted:#a89a80;
    --text-faint:#6f6350;
    --gold:#d4a24c;
    --gold-soft:#e8c988;
    --rust:#c17845;
    --sage:#8ba07c;
    --ink:#7d94a8;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,162,76,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:300;
    line-height:1.75;
  }
  h1,h2,h3,h4{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    margin:0;
    color:var(--text);
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:120px 24px 90px;
    text-align:center;
    overflow:hidden;
    border-bottom:1px solid var(--border-soft);
  }
  .hero::before{
    content:"";
    position:absolute;
    top:-220px; left:50%; transform:translateX(-50%);
    width:640px; height:640px;
    background:radial-gradient(circle, rgba(232,201,136,0.22) 0%, rgba(232,201,136,0.06) 40%, transparent 72%);
    filter:blur(2px);
    pointer-events:none;
  }
  .hero-eyebrow{
    position:relative;
    display:inline-block;
    font-family:'Noto Sans TC', sans-serif;
    letter-spacing:0.35em;
    font-size:12px;
    color:var(--gold-soft);
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .hero h1{
    position:relative;
    font-size:clamp(34px, 6vw, 64px);
    line-height:1.25;
    letter-spacing:0.02em;
    background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 55%, #a97a34 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p{
    position:relative;
    max-width:620px;
    margin:26px auto 0;
    color:var(--text-muted);
    font-size:16px;
  }
  .hero-stats{
    position:relative;
    display:flex;
    justify-content:center;
    gap:48px;
    margin-top:46px;
    flex-wrap:wrap;
  }
  .hero-stat b{
    display:block;
    font-family:'Noto Serif TC', serif;
    font-size:30px;
    color:var(--gold-soft);
  }
  .hero-stat span{
    font-size:12px;
    letter-spacing:0.15em;
    color:var(--text-faint);
  }

  /* ---------- Sticky shelf nav ---------- */
  .shelf-nav{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(21,17,13,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:14px 16px;
  }
  .shelf-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .shelf-inner::-webkit-scrollbar{height:4px;}
  .shelf-inner::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  .tab{
    flex:0 0 auto;
    padding:9px 18px;
    border-radius:3px 3px 8px 8px;
    background:var(--card);
    border:1px solid var(--border);
    border-top:3px solid var(--gold);
    color:var(--text-muted);
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .15s ease, color .15s ease, background .15s ease;
    transform:rotate(-0.6deg);
  }
  .tab:nth-child(even){ transform:rotate(0.6deg); }
  .tab:hover{ color:var(--gold-soft); background:var(--card-hover); }
  .tab.active{
    color:var(--bg);
    background:var(--gold-soft);
    border-color:var(--gold-soft);
    transform:rotate(0deg) translateY(-2px);
  }
  .search-box{
    margin-left:auto;
    flex:0 0 auto;
    position:relative;
  }
  .search-box input{
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:20px;
    color:var(--text);
    padding:9px 16px 9px 34px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    width:180px;
    transition:width .2s ease, border-color .2s ease;
  }
  .search-box input:focus{
    outline:none;
    width:230px;
    border-color:var(--gold);
  }
  .search-box::before{
    content:"⌕";
    position:absolute;
    left:12px; top:50%; transform:translateY(-50%);
    color:var(--text-faint);
    font-size:15px;
    pointer-events:none;
  }

  main{ max-width:1100px; margin:0 auto; padding:60px 24px 40px; }
  .section{ margin-bottom:74px; scroll-margin-top:78px; }
  .section-head{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:8px;
    border-bottom:1px solid var(--border-soft);
    padding-bottom:16px;
  }
  .section-head .num{
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    color:var(--text-faint);
    letter-spacing:0.1em;
  }
  .section-head h2{ font-size:26px; }
  .section-head .count{
    margin-left:auto;
    font-size:13px;
    color:var(--text-faint);
    font-family:'Noto Sans TC', sans-serif;
  }
  .section-desc{
    color:var(--text-muted);
    font-size:14.5px;
    margin:14px 0 30px;
    max-width:640px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:18px;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:22px 22px 20px;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:var(--shadow);
    background:var(--card-hover);
  }
  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .card h3{
    font-size:17px;
    line-height:1.4;
  }
  .card h3 a{
    border-bottom:1px solid transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .card h3 a:hover{
    color:var(--gold-soft);
    border-color:var(--gold-soft);
  }
  .badge{
    flex:0 0 auto;
    font-size:10.5px;
    letter-spacing:0.06em;
    padding:3px 9px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--text-faint);
    white-space:nowrap;
  }

  .badge.group{ color:var(--ink); border-color:rgba(125,148,168,0.4); }
  .card p{
    font-size:13.8px;
    color:var(--text-muted);
    margin:0;
    flex:1;
  }
  .card .go{
    font-size:12.5px;
    color:var(--gold);
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .card .go::after{ content:"→"; transition:transform .15s ease; }
  .card:hover .go::after{ transform:translateX(3px); }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
    font-size:14px;
    display:none;
  }

  footer{
    border-top:1px solid var(--border-soft);
    padding:50px 24px 70px;
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
  }

    font-family:'Noto Serif TC', serif;
    font-size:17px;
    color:var(--text-muted);
    max-width:520px;
    margin:0 auto 22px;
    line-height:1.9;
  }
  footer a{ color:var(--gold-soft); }

  @media (max-width:640px){
    .hero{ padding:90px 20px 60px; }
    .hero-stats{ gap:28px; }
    main{ padding:44px 16px 20px; }
    .search-box input{ width:130px; }
    .search-box input:focus{ width:160px; }
  }
</style>
</head>

  {cat:"blog", name:"Zen大的敦南新生活", url:"https://zen1976.com/category/%e6%9b%b8%e8%a8%8a%e8%88%87%e6%9b%b8%e8%a9%95/", desc:"年讀五百本書，累計655篇書評文章，對閱讀與寫作見解深刻。"},

  {cat:"blog", name:"姆斯的閱讀空間", url:"https://vocus.cc/maxjamesread/home", desc:"新銳書評作者，「2020年做得最好的決定就是開始寫讀書心得並公開發表」。"},
  {cat:"blog", name:"閱讀前哨站", url:"https://readingoutpost.com/", desc:"站長 Waki 瓦基，每週分享閱讀筆記與讀後心得，另有 Podcast「下一本讀什麼？」。"},
];

const CATS = [
  {key:"tw",   label:"台灣書評網站", icon:"📚"},
  {key:"dl",   label:"書下載網站",   icon:"📥"},
  {key:"intl", label:"國外書評網站", icon:"🌍"},
  {key:"yt",   label:"Youtube說書頻道", icon:"▶"},
  {key:"fb",   label:"FB粉專與社團", icon:"👥"},
  {key:"blog", label:"個人部落格分享", icon:"✍"},
];

const tabBar = document.getElementById('tabBar');
const main = document.getElementById('main');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
document.getElementById('stat-total').textContent = DATA.length;

// inject category tabs before the search box
const searchBox = tabBar.querySelector('.search-box');
CATS.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.dataset.cat = c.key;
  btn.textContent = `${c.icon} ${c.label}`;
  tabBar.insertBefore(btn, searchBox);
});

function buildSections(){
  main.innerHTML = '';
  CATS.forEach((c, i) => {
    const items = DATA.filter(d => d.cat === c.key);
    const section = document.createElement('section');
    section.className = 'section';
    section.id = 'sec-' + c.key;
    section.innerHTML = `
      <div class="section-head">
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <h2>${c.icon} ${c.label}</h2>
        <span class="count">${items.length} 個</span>
      </div>
      <div class="grid" data-cat="${c.key}"></div>
    `;
    main.appendChild(section);
    const grid = section.querySelector('.grid');
    items.forEach(item => grid.appendChild(makeCard(item)));
  });
}

function makeCard(item){
  const card = document.createElement('a');
  card.className = 'card';
  card.href = item.url;
  card.target = '_blank';
  card.rel = 'noopener';
  card.dataset.name = item.name.toLowerCase();
  card.dataset.desc = item.desc.toLowerCase();
  const badgeClass = item.badge === '付費' ? 'paid' : (item.badge === '社團' ? 'group' : '');
  card.innerHTML = `
    <div class="card-top">
      <h3><span>${item.name}</span></h3>
      ${item.badge ? `<span class="badge ${badgeClass}">${item.badge}</span>` : ''}
    </div>
    <p>${item.desc}</p>
    <span class="go">前往看看</span>
  `;
  return card;
}

buildSections();

// tab filter
tabBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  document.querySelectorAll('.section').forEach(sec => {
    sec.style.display = (cat === 'all' || sec.id === 'sec-' + cat) ? '' : 'none';
  });
  if(cat !== 'all'){
    document.getElementById('sec-' + cat).scrollIntoView({behavior:'smooth', block:'start'});
  }
});

// search filter
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.section').forEach(sec => sec.style.display = '');
  tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabBar.querySelector('.tab[data-cat="all"]').classList.add('active');

  document.querySelectorAll('.card').forEach(card => {
    const match = !q || card.dataset.name.includes(q) || card.dataset.desc.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });
  document.querySelectorAll('.section').forEach(sec => {
    const visibleCards = sec.querySelectorAll('.card:not([style*="display: none"])').length;
    sec.style.display = visibleCards === 0 ? 'none' : '';
  });
  emptyState.style.display = anyVisible ? 'none' : 'block';
});
</script>
