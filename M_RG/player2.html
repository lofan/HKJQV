<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuous YouTube Playlist Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .player-container {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      background-color: #ff0000;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <h1>Continuous Playlist Player</h1>
  
  <div class="player-container">
    <div id="player"></div>
  </div>

  <div class="controls">
    <button onclick="playNext()">Next Video</button>
    <button onclick="unmutePlayer()">Unmute</button>
  </div>

  <script>
    // 1. Target Playlist ID (Replace with your actual Playlist ID)
    const PLAYLIST_ID = 'PLMC9KNkIncKtPzgY-5rmhvjCfaxzp4xoj';

    // 2. Load the IFrame Player API code asynchronously
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player;

    // 3. This function creates an <iframe> (and YouTube player) after the API code downloads
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: {
          'listType': 'playlist',
          'list': PLAYLIST_ID,
          'autoplay': 1,
          'mute': 1,          // Required for reliable browser autoplay
          'controls': 1,      // Show video controls
          'loop': 1,          // Loop parameter for native looping
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 4. The API will call this function when the video player is ready
    function onPlayerReady(event) {
      event.target.playVideoAt(0); // Start playing from the first item
    }

    // 5. Handle state changes to enforce continuous looping
    function onPlayerStateChange(event) {
      // YT.PlayerState.ENDED is triggered when the entire playlist reaches the end
      if (event.data === YT.PlayerState.ENDED) {
        player.playVideoAt(0); // Jump back to the beginning of the playlist
      }
    }

    // Control functions
    function playNext() {
      if (player) player.nextVideo();
    }

    function unmutePlayer() {
      if (player) {
        player.unMute();
        player.setVolume(100);
      }
    }
  </script>

</body>
</html>
