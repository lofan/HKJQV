<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wikipedia & Multi-Engine Search Tool R2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --header-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1c1e21;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --label-color: #65676b;
            --accent-color: #0064d1;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --header-bg: rgba(36, 37, 38, 0.95);
            --text-color: #e4e6eb;
            --card-bg: #242526;
            --border-color: #3e4042;
            --label-color: #b0b3b8;
            --accent-color: #4599ff;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s ease; margin: 0; }
        header { padding: 20px 15px; background: var(--header-bg); backdrop-filter: blur(10px); box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .theme-toggle { position: absolute; top: 15px; right: 15px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; width: 36px; height: 36px; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-container { max-width: 800px; margin: 0 auto; }
        .search-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 12px; width: 100%; }
        .search-bar { border-radius: 28px; padding: 12px 45px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-color); font-size: 16px; width: 100%; }
        .search-bar:focus { border-color: var(--accent-color); outline: none; }
        .search-icon { position: absolute; left: 18px; color: var(--label-color); pointer-events: none; }
        .clear-icon { position: absolute; right: 15px; color: var(--label-color); cursor: pointer; display: none; padding: 8px; }
        
        .history-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; justify-content: center; }
        .history-tag { font-size: 0.75rem; background: var(--border-color); color: var(--text-color); padding: 2px 10px; border-radius: 10px; text-decoration: none; cursor: pointer; opacity: 0.8; }
        .history-tag:hover { opacity: 1; background: var(--accent-color); color: white; }

        .search-label { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; color: var(--label-color); font-size: 0.85rem; align-items: center; margin-top: 10px; }
        .search-label a { text-decoration: none; color: var(--accent-color); padding: 4px 8px; border-radius: 12px; background: rgba(0, 100, 209, 0.05); cursor: pointer; }
        .lang-active { background: var(--accent-color) !important; color: white !important; font-weight: 600; }
        .action-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-action { border-radius: 20px; padding: 8px 20px; font-size: 0.9rem; font-weight: 600; border: none; }
        .btn-primary-custom { background-color: var(--accent-color); color: white; }
        .btn-secondary-custom { background-color: #65676b; color: white; }
        .article-card { background: var(--card-bg); padding: 18px; margin-bottom: 12px; border-radius: 12px; display: block; color: inherit; border: 1px solid transparent; text-decoration: none; }
        .article-card:hover { border-color: var(--accent-color); }
        .article-card h3 { color: var(--accent-color); font-size: 1.15rem; font-weight: 700; }
        .loading-spinner { display: none; text-align: center; padding: 40px; }
    </style>
</head>
<body>

<header>
    <button class="theme-toggle" id="theme-toggle"><i class="fa fa-moon-o"></i></button>
    <div class="search-container">
        <form id="search-form">
            <div class="search-wrapper">
                <i class="fa fa-search search-icon"></i>
                <input type="text" id="search-bar" class="search-bar" placeholder="搜尋維基百科..." autocomplete="off" required>
                <i class="fa fa-times-circle clear-icon" id="clear-search"></i>
            </div>
            <div id="history-container" class="history-container"></div>
            <div class="search-label" id="lang-selector">
                <a onclick="changeLang('zh', this)" class="lang-active">ZH</a> 
                <a onclick="changeLang('en', this)">EN</a> 
                <a onclick="changeLang('ja', this)">JP</a> 
                <span style="opacity: 0.3; margin: 0 5px">|</span>
                <a onclick="externalSearch('amazon')">Amazon</a>
                <a onclick="externalSearch('youtube')">YouTube</a>
            </div>
        </form>
        <div class="action-buttons">
            <button type="button" class="btn btn-action btn-primary-custom" id="random-topic"><i class="fa fa-lightbulb-o"></i> 靈感</button>
            <button type="button" class="btn btn-action btn-secondary-custom" id="surprise"><i class="fa fa-random"></i> 隨機</button>
        </div>
    </div>
</header>

<main class="container-fluid py-3">
    <div id="loading" class="loading-spinner"><div class="spinner-border text-primary"></div></div>
    <div id="wiki-articles" class="wiki-articles mx-auto" style="max-width: 800px;"></div>
</main>

<script>
    let currentLang = 'zh';
    const searchBar = document.getElementById('search-bar');
    const historyContainer = document.getElementById('history-container');
    const themeToggle = document.getElementById('theme-toggle');

    themeToggle.addEventListener('click', () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        themeToggle.querySelector('i').className = isDark ? 'fa fa-moon-o' : 'fa fa-sun-o';
    });

    function changeLang(lang, element) {
        currentLang = lang;
        document.querySelectorAll('#lang-selector a').forEach(a => a.classList.remove('lang-active'));
        if(element) element.classList.add('lang-active');
        if(searchBar.value.trim()) performSearch(searchBar.value);
    }

    function externalSearch(engine) {
        const term = searchBar.value.trim();
        if (!term) return;
        let url = '';
        if (engine === 'amazon') url = `https://www.amazon.com/s?k=${encodeURIComponent(term)}`;
        else if (engine === 'youtube') url = `https://www.youtube.com/results?search_query=${encodeURIComponent(term)}`;
        window.open(url, '_blank');
    }

    function updateHistory(term) {
        let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
        history = [term, ...history.filter(t => t !== term)].slice(0, 50);
        localStorage.setItem('searchHistory', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
        historyContainer.innerHTML = history.map(t => `<span class="history-tag" onclick="useHistory('${t}')">${t}</span>`).join('');
    }

    function useHistory(term) { searchBar.value = term; performSearch(term); }

    async function performSearch(searchTerm) {
        if (!searchTerm.trim()) return;
        updateHistory(searchTerm);
        const container = document.getElementById('wiki-articles');
        document.getElementById('loading').style.display = 'block';
        container.innerHTML = '';
        try {
            const res = await fetch(`https://${currentLang}.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&generator=search&exsentences=2&exintro=1&explaintext=1&gsrsearch=${encodeURIComponent(searchTerm)}&origin=*`);
            const data = await res.json();
            document.getElementById('loading').style.display = 'none';
            if (data.query?.pages) {
                Object.values(data.query.pages).forEach(page => {
                    container.innerHTML += `<a class="article-card" href="https://${currentLang}.wikipedia.org/?curid=${page.pageid}" target="_blank"><h3>${page.title}</h3><p>${page.extract || '...'}</p></a>`;
                });
            } else { container.innerHTML = '<div class="text-center">查無結果</div>'; }
        } catch (e) { document.getElementById('loading').style.display = 'none'; }
    }

    document.getElementById('clear-search').addEventListener('click', () => { 
        searchBar.value = ''; 
        document.getElementById('clear-search').style.display = 'none'; 
        document.getElementById('wiki-articles').innerHTML = ''; 
    });
    
    searchBar.addEventListener('input', (e) => document.getElementById('clear-search').style.display = e.target.value ? 'block' : 'none');
    document.getElementById('search-form').addEventListener('submit', (e) => { e.preventDefault(); performSearch(searchBar.value); });
    document.getElementById('random-topic').addEventListener('click', () => { const t = '量子力學'; searchBar.value = t; performSearch(t); });
    document.getElementById('surprise').addEventListener('click', () => window.open(`https://${currentLang}.wikipedia.org/wiki/Special:Random`, '_blank'));
    
    renderHistory();
</script>
</body>
</html>
